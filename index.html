<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGI Lab Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f1e8; --surface:#fffdf7; --ink:#1a1814; --ink-2:#4a4640;
    --muted:#6b6559; --muted-2:#8f8a7c;
    --line:#ebe5d4; --line-2:#d9d2bd;
    --accent:#cf3d1e; --accent-d:#a8311a; --accent-soft:#fae6e0;
    --ok:#2d7549; --ok-soft:#e6f0e9;
    --warn-soft:#fde9e4;
    --r-sm:6px; --r:10px; --r-lg:14px;
    --t:160ms cubic-bezier(.4,0,.2,1);
    --shadow-sm:0 1px 2px rgba(26,24,20,.04);
    --shadow:0 4px 16px rgba(26,24,20,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    font-size:14.5px;line-height:1.55;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  body{padding-bottom:80px;}
  h1,h2,h3{font-family:'Bricolage Grotesque','Archivo',sans-serif;
    line-height:1.15;letter-spacing:-.02em;}
  .wrap{max-width:1900px;margin:0 auto;padding:0 12px;}

  /* header */
  header{border-bottom:1px solid var(--line);
    background:rgba(245,241,232,.85);backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);
    position:sticky;top:0;z-index:30;}
  .hbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap;}
  .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:22px;letter-spacing:-.03em;cursor:pointer;color:var(--ink);
    transition:opacity var(--t);user-select:none;}
  .brand:hover{opacity:.65;}
  .brand .dot{color:var(--accent);}
  .crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;}
  .crumb .pname{color:var(--ink);font-weight:600;font-size:14px;}
  .crumb .sep{color:var(--muted-2);}
  .code-chip{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;
    font-weight:600;letter-spacing:.04em;background:var(--ink);color:var(--paper);
    padding:4px 10px;border-radius:999px;cursor:pointer;border:none;
    transition:opacity var(--t),transform var(--t);display:inline-flex;
    align-items:center;gap:5px;}
  .code-chip:hover{opacity:.82;}
  .code-chip:active{transform:scale(.96);}
  .code-chip svg{width:11px;height:11px;opacity:.7;}

  .help-btn{margin-left:auto;border:1px solid var(--line-2);background:var(--surface);
    color:var(--ink);width:28px;height:28px;border-radius:50%;cursor:pointer;
    font-size:13px;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background var(--t),border-color var(--t),color var(--t);
    flex-shrink:0;}
  .help-btn:hover{border-color:var(--ink);background:var(--paper);color:var(--accent);}
  .tabs ~ .help-btn{margin-left:8px;}

  .tabs{display:flex;gap:2px;margin-left:auto;background:var(--paper);
    padding:3px;border-radius:8px;border:1px solid var(--line);}
  .tab{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:13px;
    padding:6px 14px;background:transparent;border:none;cursor:pointer;
    color:var(--muted);border-radius:5px;
    transition:color var(--t),background var(--t),box-shadow var(--t);}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm);}

  /* layout */
  main{padding:28px 0 60px;}
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:22px;margin-bottom:14px;}
  .card h2{font-size:18px;font-weight:700;margin-bottom:4px;}
  .card .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .card-head h2{margin:0;}
  .section-label{font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .section-label .count{color:var(--muted-2);font-weight:500;letter-spacing:.04em;}

  /* buttons */
  button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  .btn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;
    letter-spacing:-.005em;display:inline-flex;align-items:center;gap:6px;
    transition:background var(--t),border-color var(--t),
      color var(--t),opacity var(--t),transform var(--t);}
  .btn:hover{background:#2d2924;border-color:#2d2924;}
  .btn:active{transform:translateY(.5px);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2);}
  .btn.ghost:hover{background:var(--paper);border-color:var(--ink);color:var(--ink);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn.accent:hover{background:var(--accent-d);border-color:var(--accent-d);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .btn.danger{background:transparent;border-color:var(--line-2);color:var(--accent);}
  .btn.danger:hover{background:var(--accent-soft);border-color:var(--accent);
    color:var(--accent-d);}
  .btn.danger:disabled:hover{background:transparent;border-color:var(--line-2);
    color:var(--accent);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--ink);border-color:var(--ink);transform:none;}
  .btn.ghost:disabled:hover{background:transparent;border-color:var(--line-2);}

  /* inputs */
  input[type=text],input[type=date],input[type=number],select{
    border:1px solid var(--line-2);background:var(--surface);
    padding:8px 11px;border-radius:var(--r-sm);
    transition:border-color var(--t),box-shadow var(--t);}
  input:focus,select:focus{outline:none;border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(26,24,20,.08);}
  input:disabled,select:disabled{opacity:.6;background:var(--paper);
    cursor:not-allowed;}
  label.fld{display:block;margin-bottom:14px;}
  label.fld .lab{display:block;font-size:11px;font-weight:600;color:var(--muted);
    margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > *{flex:1;min-width:130px;}

  /* lock pill */
  .lock-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:3px 9px;border-radius:999px;letter-spacing:.02em;}

  /* list items */
  .list-item{display:flex;align-items:center;gap:10px;padding:7px 8px;
    border-radius:var(--r-sm);transition:background var(--t);margin:0 -8px;}
  .list-item:hover{background:var(--paper);}
  .list-item input[type=text]{flex:1;border-color:transparent;background:transparent;}
  .list-item input[type=text]:hover:not(:disabled){background:var(--surface);
    border-color:var(--line);}
  .list-item input[type=text]:focus{background:var(--surface);border-color:var(--ink);}
  /* 배정 장소 모드 */
  .mode-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 14px;
    padding:9px 13px;background:var(--paper);border-radius:var(--r-sm);border:1px solid var(--line);}
  .mode-lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);}
  .mode-btn{border:1px solid var(--line-2);background:var(--surface);cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;
    color:var(--muted);transition:all var(--t);}
  .mode-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .mode-btn.ext.on{background:#7c5cff;border-color:#7c5cff;}
  .mode-hint{font-size:11.5px;color:var(--muted);margin-left:2px;}
  /* 결과 탭 그룹 선택(다중 토글) */
  .group-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;
    padding:8px 12px;background:var(--paper);border-radius:var(--r-sm);border:1px solid var(--line);}
  .grp-tog-row{display:flex;gap:5px;flex-wrap:wrap;}
  .grp-tog{border:1px solid var(--line-2);background:var(--surface);cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;
    color:var(--muted);transition:all var(--t);display:inline-flex;align-items:center;gap:6px;}
  .grp-tog:hover{border-color:var(--ink);color:var(--ink);}
  .grp-tog.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .grp-tog-n{font-size:10.5px;opacity:.75;font-family:ui-monospace,Menlo,monospace;}
  .grp-tog.on .grp-tog-n{opacity:.85;}
  /* 설정 탭 — 그룹 카드 (활동/참여자/참여표 묶음) */
  .grp-card{border-left:4px solid var(--accent);}
  .grp-card .grp-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;
    padding-bottom:10px;border-bottom:1px solid var(--line);}
  .grp-card .grp-idx{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:18px;color:var(--accent);min-width:22px;}
  .grp-card .grp-name{flex:1;border:1px solid transparent;background:transparent;
    padding:6px 9px;border-radius:4px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);}
  .grp-card .grp-name:hover:not(:disabled){background:var(--paper);border-color:var(--line);}
  .grp-card .grp-name:focus{background:var(--paper);border-color:var(--ink);outline:none;}
  .grp-sub{margin:14px 0;padding-top:8px;}
  .grp-sub + .grp-sub{border-top:1px dashed var(--line);padding-top:14px;}
  .grp-sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;margin-bottom:10px;}
  .idx{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    color:var(--muted-2);font-size:12px;width:24px;text-align:right;}
  .x{border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:18px;line-height:1;padding:4px 8px;border-radius:4px;
    transition:color var(--t),background var(--t);}
  .x:hover:not(:disabled){color:var(--accent);background:var(--accent-soft);}
  .x:disabled{opacity:.3;cursor:not-allowed;}

  /* scroll & grid */
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);
    -webkit-overflow-scrolling:touch;background:var(--surface);}
  .scroll.tall{max-height:65vh;}
  table.grid{border-collapse:separate;border-spacing:0;background:var(--surface);}
  table.grid th,table.grid td{border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);}
  th.corner{position:sticky;top:0;left:0;z-index:5;background:var(--ink);
    color:var(--paper);font-size:11px;font-weight:600;padding:8px 10px;
    letter-spacing:.04em;}
  th.col{position:sticky;top:0;z-index:4;background:var(--ink);color:var(--paper);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11px;
    padding:6px 4px;min-width:50px;white-space:nowrap;}
  th.col .wd{display:block;font-size:10px;opacity:.65;font-family:'Archivo';
    font-weight:400;margin-top:2px;}
  th.col.sat{color:#9ac8e8;} th.col.sun{color:#e89c92;}
  td.rh{position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);
    font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:11px;
    padding:0 10px;white-space:nowrap;text-align:right;letter-spacing:.02em;}
  td.cell{width:50px;height:28px;cursor:pointer;background:var(--surface);
    text-align:center;position:relative;transition:background 100ms ease;}
  td.cell:hover{background:var(--paper);}
  td.cell.no{background:var(--accent);}
  td.cell.no:hover{background:var(--accent-d);}
  td.cell .cnt{position:absolute;top:2px;right:3px;font-size:9px;
    color:var(--muted);font-weight:600;}
  td.cell.no .cnt{color:rgba(255,255,255,.75);}
  .grid-touch td.cell{touch-action:auto;}

  /* matrix */
  td.mx{width:48px;height:32px;cursor:pointer;background:var(--surface);
    text-align:center;transition:background 100ms ease;}
  td.mx:hover{background:var(--paper);}
  td.mx .chk{display:inline-block;width:16px;height:16px;border-radius:4px;
    border:1.5px solid var(--line-2);vertical-align:middle;
    transition:background var(--t),border-color var(--t);}
  td.mx.on .chk{background:var(--accent);border-color:var(--accent);
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 8.5l3 3 6-7' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-position:center;background-repeat:no-repeat;background-size:13px;}
  td.mx.on{background:var(--accent-soft);}
  td.mx.locked{cursor:default;pointer-events:none;opacity:.85;}
  td.song-h{position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
    padding:0 12px;white-space:nowrap;}

  /* pills & badges */
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;
    background:var(--paper);color:var(--ink-2);margin:2px 3px 2px 0;
    font-weight:500;border:1px solid var(--line);}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
  .pill.asg{background:var(--accent);color:#fff;border-color:transparent;
    font-weight:600;}
  .badge{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;}

  /* song result cards */
  .song-res{border:1px solid var(--line);border-radius:var(--r-sm);
    padding:14px 16px;margin-bottom:8px;background:var(--surface);
    transition:border-color var(--t);}
  .song-res:hover{border-color:var(--line-2);}
  .song-res.zero{border-color:rgba(207,61,30,.35);background:var(--warn-soft);}
  .song-res .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin-bottom:8px;}
  .song-res .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:15px;}
  .song-res .mem{font-size:12px;color:var(--muted);}
  .song-res .slots{font-size:13px;}
  .daygrp{margin:5px 0;line-height:1.9;}
  .daygrp .dl{font-weight:600;font-size:11px;color:var(--muted);
    letter-spacing:.04em;text-transform:uppercase;margin-right:6px;}
  .zero-msg{color:var(--accent-d);font-weight:600;font-size:13px;}

  /* results grid extras */
  td.cell.assigned{background:var(--accent);}
  td.cell.assigned:hover{background:var(--accent);}
  td.cell.assigned .asg{font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:11px;color:#fff;line-height:1;}
  td.cell .okn{display:inline-block;font-size:9.5px;font-weight:600;
    color:var(--ink);line-height:1.1;padding:1px 2px;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  td.cell .nbadge{position:absolute;top:1px;left:3px;font-size:8px;
    font-weight:700;color:var(--muted);}
  /* 주차 탭 */
  .week-tabs{display:inline-flex;flex-wrap:wrap;gap:2px;margin:6px 0 14px;
    padding:4px;background:var(--paper);border-radius:9px;
    border:1px solid var(--line);}
  .week-tab{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    font-size:12px;padding:6px 14px;background:transparent;border:none;
    cursor:pointer;color:var(--muted);border-radius:6px;line-height:1.2;
    text-align:center;transition:color var(--t),background var(--t),box-shadow var(--t);}
  .week-tab:hover{color:var(--ink);}
  .week-tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm);}
  .week-tab .wkn{display:block;font-size:10px;color:var(--muted);
    font-family:'Archivo';font-weight:400;margin-top:1px;letter-spacing:.02em;}
  .week-tab.on .wkn{color:var(--muted);}

  /* transpose 그리드 — 날짜가 행, 시간이 열 */
  td.rh-date{position:sticky;left:0;z-index:3;background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;font-size:11px;padding:0 12px;white-space:nowrap;
    text-align:right;min-width:88px;line-height:1.1;}
  td.rh-date .wd{font-size:10px;opacity:.6;font-family:'Archivo';
    font-weight:400;margin-right:5px;}
  td.rh-date.sat{color:#9ac8e8;}
  td.rh-date.sun{color:#e89c92;}
  th.col-time{position:sticky;top:0;z-index:4;background:var(--ink);
    color:var(--paper);font-family:ui-monospace,Menlo,monospace;
    font-weight:600;font-size:10.5px;padding:7px 4px;min-width:50px;
    white-space:nowrap;letter-spacing:.01em;}

  /* 참여자 칩 클릭 가능하게 */
  button.mstat{cursor:pointer;color:var(--ink);font-family:inherit;}
  button.mstat:hover{border-color:var(--ink);}
  button.mstat.done:hover{border-color:var(--ok);}

  /* 간트 그리드 */
  table.gantt th.gnt-corner{position:sticky;top:0;left:0;z-index:6;
    background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;
    padding:8px 10px;letter-spacing:.04em;}
  table.gantt th.gnt-day{position:sticky;top:0;z-index:4;height:28px;background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:11px;padding:6px 4px;text-align:center;
    border-right:4px solid var(--ink);border-bottom:0;}
  table.gantt th.gnt-day .wd{display:inline-block;font-size:10px;opacity:.65;
    font-family:'Archivo';font-weight:400;margin-left:2px;}
  table.gantt th.gnt-day.sat{color:#9ac8e8;}
  table.gantt th.gnt-day.sun{color:#e89c92;}
  table.gantt th.gnt-sub{position:sticky;top:28px;z-index:4;background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    font-size:10.5px;padding:6px 2px 5px;text-align:center;min-width:26px;
    white-space:nowrap;letter-spacing:-.01em;border-bottom:1px solid var(--ink);}
  table.gantt th.gnt-sub::before{content:'';display:block;height:5px;width:100%;
    background:var(--sc,#888);margin-bottom:4px;border-radius:2px;}
  table.gantt th.gnt-sub.day-end{border-right:4px solid var(--ink);}
  table.gantt td.gnt-cell{width:26px;height:30px;cursor:pointer;padding:0;
    position:relative;
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    transition:filter 80ms ease;}
  table.gantt td.gnt-cell.day-end{border-right:4px solid var(--ink);}
  table.gantt td.gnt-cell.feasible:hover, table.gantt td.gnt-cell.has:hover{filter:brightness(.88);}
  table.gantt td.gnt-cell.infeasible{cursor:not-allowed;
    background:repeating-linear-gradient(135deg, var(--surface) 0 3px,
      rgba(26,24,20,.04) 3px 6px) !important;}
  table.gantt td.gnt-cell.conflict{cursor:not-allowed;
    background-image:repeating-linear-gradient(135deg,
      rgba(255,255,255,.65) 0 3px, transparent 3px 6px);}
  table.gantt td.gnt-cell.preview-outline{outline:2px solid var(--ink);
    outline-offset:-2px;}
  table.gantt td.gnt-cell.has{position:relative;}
  table.gantt td.gnt-cell.has.ext{background-image:repeating-linear-gradient(135deg,
    rgba(255,255,255,.45) 0 2px, transparent 2px 5px);}
  table.gantt td.gnt-cell.has.locked{cursor:not-allowed;opacity:.72;}
  .gnt-ext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;pointer-events:none;filter:drop-shadow(0 0 1px rgba(0,0,0,.5));}
  .cal-block.ext{background-image:repeating-linear-gradient(135deg,
    rgba(255,255,255,.28) 0 3px, transparent 3px 7px);}

  /* 메인 페이지: 전체 합주 월간 캘린더 */
  .agg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:12px;}
  .agg-head .section-label{margin:0;}
  .agg-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;}
  .agg-nav{display:inline-flex;align-items:center;border:1px solid var(--line-2);
    border-radius:var(--r-sm);overflow:hidden;background:var(--surface);height:34px;}
  .agg-nav button{width:32px;height:32px;border:0;background:transparent;cursor:pointer;
    color:var(--ink);font-size:19px;line-height:1;display:flex;align-items:center;
    justify-content:center;transition:background var(--t),color var(--t);}
  .agg-nav button:hover{background:var(--paper);color:var(--accent);}
  .agg-month-title{min-width:112px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;
    font-size:14px;font-weight:700;}
  .agg-project,.agg-member{height:34px;padding-top:6px;padding-bottom:6px;}
  .agg-project{min-width:180px;max-width:270px;}
  .agg-member{min-width:150px;max-width:220px;}
  .agg-cal-wrap{position:relative;}
  .agg-cal-wrap::before,.agg-cal-wrap::after{content:'';position:absolute;top:0;bottom:0;
    width:26px;pointer-events:none;opacity:0;transition:opacity .18s;z-index:2;}
  .agg-cal-wrap::before{left:0;border-radius:var(--r-sm) 0 0 var(--r-sm);
    background:linear-gradient(to right,rgba(31,26,18,.16),transparent);}
  .agg-cal-wrap::after{right:0;border-radius:0 var(--r-sm) var(--r-sm) 0;
    background:linear-gradient(to left,rgba(31,26,18,.16),transparent);}
  .agg-cal-wrap.can-l::before{opacity:1;} .agg-cal-wrap.can-r::after{opacity:1;}
  .agg-cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);-webkit-overflow-scrolling:touch;}
  .agg-cal{min-width:770px;}
  .agg-swipe-hint{display:none;}
  .agg-export-title{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:800;
    padding:11px 12px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;left:0;max-width:100vw;box-sizing:border-box;}   /* 가로 스크롤에도 제목은 왼쪽 고정 */
  .agg-export-title span{font-family:'Archivo',sans-serif;font-size:11px;font-weight:500;
    color:var(--muted);margin-left:5px;}
  .agg-weekdays,.agg-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .agg-weekday{background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;
    padding:7px 8px;text-align:center;border-right:1px solid #000;}
  .agg-weekday:last-child{border-right:0;}
  .agg-weekday.sun{color:#e89c92;} .agg-weekday.sat{color:#9ac8e8;}
  .agg-cell{min-height:118px;padding:7px;border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);background:var(--surface);min-width:0;}
  .agg-cell:nth-child(7n){border-right:0;}
  .agg-cell:nth-last-child(-n+7){border-bottom:0;}
  .agg-cell.out{background:rgba(245,241,232,.42);}
  .agg-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .agg-date-num{display:flex;align-items:center;justify-content:space-between;min-height:20px;
    font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:700;
    color:var(--ink-2);margin-bottom:4px;}
  .agg-cell.out .agg-date-num{color:var(--muted-2);}
  .agg-cell.sun .agg-date-num{color:var(--accent);}
  .agg-cell.sat .agg-date-num{color:#3a7ab8;}
  .agg-cell.today .agg-date-num span{background:var(--accent);color:#fff;width:22px;height:22px;
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
  .agg-events{display:flex;flex-direction:column;gap:4px;}
  .agg-event{width:100%;border:1px solid var(--line);border-left:3px solid var(--pc);
    border-radius:4px;background:var(--paper);padding:5px 6px;text-align:left;cursor:pointer;
    overflow:hidden;display:flex;flex-direction:column;gap:2px;
    transition:border-color var(--t),background var(--t);}
  .agg-event:hover{border-color:var(--pc);background:var(--surface);}
  .agg-event-time{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;
    color:var(--ink-2);white-space:nowrap;line-height:1.2;}
  .agg-event-song-row{display:flex;align-items:center;gap:4px;min-width:0;width:100%;}
  .agg-event-song{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0;line-height:1.25;}
  .agg-ext{font-size:8px;font-weight:700;color:#7c5cff;flex-shrink:0;}
  .agg-month-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 0;}
  .agg-edit-project{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 12px;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);
    border-radius:6px;}
  .agg-edit-project strong{display:block;font-size:13px;color:var(--ink);}
  .agg-edit-project span{display:block;margin-top:2px;font-family:ui-monospace,'SF Mono',Menlo,monospace;
    font-size:10px;color:var(--muted);}
  .agg-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .agg-edit-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .agg-edit-field.full{grid-column:1/-1;}
  .agg-edit-field label{font-size:11px;font-weight:700;color:var(--ink-2);}
  .agg-edit-field input,.agg-edit-field select{width:100%;height:38px;min-width:0;}
  .agg-edit-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
  .agg-edit-actions-right{display:flex;justify-content:flex-end;gap:7px;margin-left:auto;}
  .calendar-sub-modal{max-width:620px;}
  .calendar-sub-person{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;
    font-weight:800;line-height:1.2;letter-spacing:0;margin-bottom:6px;}
  .calendar-sub-scope{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .calendar-sub-url{display:flex;align-items:stretch;gap:7px;}
  .calendar-sub-url input{flex:1;min-width:0;font-family:ui-monospace,'SF Mono',Menlo,monospace;
    font-size:11.5px;background:var(--paper);}
  .calendar-sub-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;
    margin-top:18px;}
  @media(max-width:560px){
    .agg-tools{width:100%;}
    .agg-project,.agg-member{flex:1 1 150px;min-width:0;max-width:none;}
    .agg-cal{min-width:700px;}
    .agg-swipe-hint{display:block;font-size:11px;color:var(--muted);text-align:right;margin-top:6px;}
    .agg-cell{min-height:106px;padding:5px;}
    .agg-events{gap:3px;}
    .agg-event{padding:4px 5px;}
    .agg-event-time{font-size:9px;}
    .agg-event-song{font-size:10px;}
    .agg-edit-grid{grid-template-columns:1fr;}
    .agg-edit-field.full{grid-column:auto;}
    .agg-edit-actions{align-items:stretch;flex-direction:column-reverse;}
    .agg-edit-actions-right{display:grid;grid-template-columns:1fr 1fr;margin-left:0;}
    .agg-edit-actions .btn{width:100%;}
    .calendar-sub-url{align-items:stretch;flex-direction:column;}
    .calendar-sub-actions{display:grid;grid-template-columns:1fr 1fr;}
    .calendar-sub-actions .btn:last-child{grid-column:1/-1;justify-content:center;}
  }

  /* 최종 시간표 카드 */
  .fd-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:18px;letter-spacing:-.02em;margin-bottom:14px;
    padding:0 2px 12px;border-bottom:1.5px solid var(--line);}
  .fd-title .fd-subtitle{font-weight:500;font-size:13px;color:var(--muted);
    margin-left:4px;letter-spacing:-.005em;}
  .fd-list{display:flex;flex-direction:column;gap:14px;}
  .fd-head{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:-.01em;margin-bottom:8px;
    color:var(--ink);}
  .fd-head .fd-wd{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px;}
  .fd-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:8px;}
  .fd-block{border:1px solid var(--line);border-left:4px solid var(--sc,var(--accent));
    border-radius:var(--r-sm);padding:11px 14px;background:var(--surface);
    transition:border-color var(--t),transform var(--t);}
  .fd-block:hover{border-color:var(--line-2);}
  .fd-block .fb-time{font-family:ui-monospace,Menlo,monospace;font-weight:600;
    font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;
    margin-bottom:4px;letter-spacing:.01em;}
  .fd-block .fb-dot{width:8px;height:8px;border-radius:50%;
    background:var(--sc,var(--accent));display:inline-block;flex-shrink:0;}
  .fd-block .fb-song{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;color:var(--ink);margin-bottom:5px;letter-spacing:-.01em;}
  .fd-block .fb-mem{font-size:12px;color:var(--muted);line-height:1.4;}
  .fd-block .fb-mem b{color:var(--ink);font-weight:600;}


  /* 활동별 요약 */
  .fs-card{border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);padding:14px 16px;margin-bottom:14px;}
  .fs-head{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .fs-h-label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:-.01em;color:var(--ink);}
  .fs-h-total{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:13px;color:var(--accent);letter-spacing:-.01em;}
  .fs-list-wrap{display:flex;flex-direction:column;gap:7px;}
  .fs-row{display:grid;grid-template-columns:14px minmax(80px,auto) auto 1fr;
    align-items:baseline;gap:10px;font-size:12.5px;line-height:1.5;}
  .fs-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);
    align-self:center;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.05);}
  .fs-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:13.5px;color:var(--ink);letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fs-count{font-size:12px;color:var(--accent);font-weight:600;
    background:var(--accent-soft);padding:1px 8px;border-radius:999px;
    white-space:nowrap;}
  .fs-list{font-size:12px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px 10px;}
  .fs-sess{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;}
  @media (max-width:640px){
    .fs-row{grid-template-columns:14px 1fr auto;}
    .fs-list{grid-column:1 / -1;padding-left:24px;}
  }

  /* 캘린더 뷰 */
  .cal{border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);overflow:hidden;}
  .cal-row{display:flex;}
  .cal-corner{flex:0 0 56px;background:var(--ink);height:32px;}
  .cal-head-days{flex:1;display:flex;}
  .cal-head-row .cal-day-head{flex:1;background:var(--ink);color:var(--paper);
    text-align:center;padding:7px 4px 6px;font-family:'Bricolage Grotesque',sans-serif;
    font-size:11px;font-weight:700;border-right:1px solid #000;height:32px;
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    gap:4px;}
  .cal-head-row .cal-day-head:last-child{border-right:0;}
  .cal-head-row .cal-day-head span{font-size:10px;opacity:.65;font-family:'Archivo';
    font-weight:400;}
  .cal-head-row .cal-day-head.sat{color:#9ac8e8;}
  .cal-head-row .cal-day-head.sun{color:#e89c92;}
  .cal-head-row .cal-day-head.out{opacity:.35;}
  .cal-time-col{flex:0 0 56px;background:var(--paper);border-right:1px solid var(--line);}
  .cal-time{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;
    color:var(--muted);padding:2px 7px 0;text-align:right;
    border-bottom:1px solid var(--line);box-sizing:border-box;line-height:1.1;}
  .cal-days{flex:1;display:flex;}
  .cal-day{flex:1;min-width:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;}
  .cal-day:last-child{border-right:0;}
  .cal-day.out{background:repeating-linear-gradient(135deg,
    transparent 0 5px,rgba(26,24,20,.025) 5px 10px);}
  .cal-day-body{position:relative;}
  .cal-day-body .cal-cell{border-bottom:1px solid var(--line);box-sizing:border-box;}
  .cal-day-body .cal-cell:last-child{border-bottom:0;}
  .cal-block{position:absolute;z-index:1;color:#fff;border-radius:5px;padding:5px 7px 4px;
    display:flex;flex-direction:column;gap:1px;line-height:1.15;
    overflow:hidden;cursor:default;box-shadow:0 1px 2px rgba(0,0,0,.10);}
  .ext-tag{display:inline-block;margin-left:5px;font-size:9px;font-weight:700;vertical-align:middle;
    padding:1px 5px;border-radius:999px;background:rgba(255,255,255,.28);color:inherit;
    font-family:'Archivo',sans-serif;letter-spacing:.02em;}
  .fs-name .ext-tag{background:#7c5cff;color:#fff;}
  .cal-block .cb-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:11.5px;letter-spacing:-.005em;text-shadow:0 1px 1px rgba(0,0,0,.15);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-block .cb-time{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;
    font-weight:500;opacity:.88;}
  .cal-block .cb-mem{font-size:10px;opacity:.92;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;}
  .cal-block .cb-mem b{font-weight:700;}

  /* 프로젝트 결과 PNG 전용: 날짜별 일정을 압축한 공유용 보드 */
  .project-png-export{position:fixed;left:-10000px;top:0;width:1280px;padding:30px;
    background:var(--surface);color:var(--ink);pointer-events:none;z-index:-1;}
  .project-png-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
    flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
  .project-png-title{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;
    line-height:1.15;font-weight:800;letter-spacing:0;}
  .project-png-range{font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .project-png-week{display:grid;grid-template-columns:repeat(var(--png-cols,4),minmax(0,1fr));
    gap:14px;align-items:start;}
  .project-png-day{border:1px solid var(--line-2);border-radius:6px;overflow:hidden;
    background:var(--surface);}
  .project-png-day-head{height:46px;padding:10px 13px;background:var(--ink);color:var(--paper);
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .project-png-day-head strong{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;
    font-weight:800;line-height:1;letter-spacing:0;}
  .project-png-day-head span{font-size:13px;font-weight:600;opacity:.72;}
  .project-png-day.sat .project-png-day-head{color:#9ac8e8;}
  .project-png-day.sun .project-png-day-head{color:#e89c92;}
  .project-png-events{display:flex;flex-direction:column;gap:8px;padding:10px;}
  .project-png-event{min-height:72px;padding:11px 12px;border-radius:5px;background:var(--sc);
    color:#fff;display:flex;flex-direction:column;gap:4px;justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .project-png-event.ext{background-image:repeating-linear-gradient(135deg,
    rgba(255,255,255,.22) 0 4px,transparent 4px 9px);}
  .project-png-time{font-family:ui-monospace,Menlo,monospace;font-size:16px;
    font-weight:700;line-height:1.15;letter-spacing:0;white-space:nowrap;}
  .project-png-song{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;
    font-weight:800;line-height:1.15;letter-spacing:0;overflow-wrap:anywhere;}
  .project-png-ext{display:inline-block;margin-left:6px;padding:2px 5px;border-radius:4px;
    background:rgba(255,255,255,.25);font-family:'Archivo',sans-serif;font-size:10px;
    font-weight:700;vertical-align:middle;}
  .project-png-empty{padding:34px;text-align:center;border:1px solid var(--line);
    color:var(--muted);font-size:16px;}

  /* 상세 탭 — 활동별 참여자 가능 캘린더 */
  table.gantt th.gnt-sub.dtl-sub{min-width:42px;padding:8px 5px 6px;
    font-size:11px;letter-spacing:0;}
  table.gantt th.gnt-sub.dtl-sub::before{display:none;}
  table.gantt td.gnt-cell.dtl-cell{width:42px;height:30px;cursor:default;}
  table.gantt td.gnt-cell.dtl-cell.dtl-yes{background:var(--ok-soft);}
  table.gantt td.gnt-cell.dtl-cell.dtl-yes-all{background:rgba(45,117,73,.38);}
  table.gantt td.gnt-cell.dtl-cell.dtl-no{background:var(--accent);}
  table.gantt td.gnt-cell.dtl-cell.out{
    background:repeating-linear-gradient(135deg,
      var(--surface) 0 4px,rgba(26,24,20,.025) 4px 8px) !important;cursor:default;}

  .dtl-mlist{margin-top:8px;}
  .dtl-mbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;}
  .dtl-mn{flex:0 0 100px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dtl-mb{flex:1;height:8px;background:var(--paper);border-radius:999px;
    border:1px solid var(--line);overflow:hidden;}
  .dtl-mf{height:100%;background:var(--accent);border-radius:999px;
    transition:width .2s ease;}
  .dtl-mc{flex:0 0 96px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;
    font-size:11px;text-align:right;}

  /* 활동별 안 되는 시간 상세 (legacy, kept for compat) */
  .blk-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .blk-song{border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);overflow:hidden;}
  .blk-song-head{padding:11px 14px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--paper);border-bottom:1px solid var(--line);}
  .blk-song-head .blk-nm{font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .blk-song-head .blk-meta{font-size:12px;color:var(--muted);}
  .blk-members{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
  .blk-mem-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .blk-mem-head b{font-size:13px;color:var(--ink);font-weight:700;}
  .blk-mem-head .blk-ct{font-size:11px;color:var(--accent);font-weight:600;
    background:var(--accent-soft);padding:1px 7px;border-radius:999px;}
  .blk-slots{display:flex;flex-direction:column;gap:3px;}
  .blk-day{font-size:12px;line-height:1.6;}
  .blk-day-l{display:inline-block;font-weight:600;font-size:11px;
    color:var(--muted);letter-spacing:.03em;text-transform:uppercase;
    margin-right:6px;min-width:54px;}
  .blk-pill{display:inline-block;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;background:var(--accent-soft);color:var(--accent-d);
    padding:2px 7px;border-radius:4px;margin:0 3px 2px 0;font-weight:500;}
  th.col.out{opacity:.4;}
  td.cell.out{background:repeating-linear-gradient(135deg,
    transparent 0 4px,rgba(26,24,20,.025) 4px 8px);cursor:default;}
  td.cell.out:hover{background:repeating-linear-gradient(135deg,
    transparent 0 4px,rgba(26,24,20,.025) 4px 8px);}

  /* 도구 팔레트 (수동 배정) */
  .tool-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    margin:12px 0 16px;padding:11px 13px;background:var(--paper);
    border-radius:var(--r-sm);border:1px solid var(--line);}
  .tool-bar .lbl{font-size:11px;font-weight:600;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin-right:4px;}
  .tool-bar .sp{width:1px;align-self:stretch;background:var(--line);margin:0 4px;}
  .tool-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;
    cursor:pointer;background:var(--surface);padding:5px 12px;border-radius:999px;
    border:1px solid var(--line-2);font-weight:500;user-select:none;
    transition:background var(--t),border-color var(--t),color var(--t);}
  .tool-chip:hover{border-color:var(--ink);}
  .tool-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tool-chip.eraser{color:var(--accent);}
  .tool-chip.eraser.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tool-chip.eraser svg{width:11px;height:11px;}
  .csw{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  .tool-chip.on .csw,.chip-toggle.on .csw{display:none;}

  /* 주차 위아래 2단 */
  .week-pair{display:flex;flex-direction:column;gap:18px;}
  .week-pane{min-width:0;}
  .week-pane .pane-title{font-size:11px;font-weight:600;color:var(--muted);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;
    display:flex;align-items:center;gap:8px;padding:0 2px;}
  .week-pane .pane-title .hint{font-size:11px;color:var(--accent);
    font-weight:600;letter-spacing:0;text-transform:none;}
  .week-pane .scroll{display:inline-block;max-width:100%;}

  /* 우측 인터랙티브 그리드 */
  td.cell.rt{cursor:default;background:var(--surface);transition:filter 80ms ease;}
  td.cell.rt.has{background:var(--accent);cursor:pointer;}
  td.cell.rt.has .lab{font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:11px;color:#fff;line-height:1;
    text-shadow:0 1px 1px rgba(0,0,0,.18);}
  td.cell.rt.feasible{cursor:pointer;}
  td.cell.rt.has:hover, td.cell.rt.feasible:hover{filter:brightness(.92);}
  td.cell.rt.infeasible{cursor:not-allowed;
    background:repeating-linear-gradient(135deg,
      var(--surface) 0 4px,rgba(26,24,20,.04) 4px 8px);}
  td.cell.rt.erasable{cursor:pointer;}
  td.cell.rt.erasable:hover{outline:2px solid #fff;outline-offset:-3px;}

  /* chip-style toggles */
  .song-toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    margin-bottom:14px;padding:10px 12px;background:var(--paper);
    border-radius:var(--r-sm);}
  .song-toggles .label{font-size:11px;font-weight:600;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin-right:4px;}
  .chip-toggle{display:inline-flex;align-items:center;font-size:12px;cursor:pointer;
    user-select:none;background:var(--surface);padding:4px 11px;border-radius:999px;
    border:1px solid var(--line-2);font-weight:500;
    transition:background var(--t),border-color var(--t),color var(--t);}
  .chip-toggle:hover{border-color:var(--ink-2);}
  .chip-toggle input{display:none;}
  .chip-toggle.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* member status chips */
  .member-status{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .mstat{display:inline-flex;align-items:center;gap:6px;font-size:12px;
    padding:4px 11px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-weight:500;}
  .mstat .dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);}
  .mstat.pending{background:#fdf2dc;border-color:transparent;color:#8a5d00;}
  .mstat.pending .dot{background:#d99300;}
  .mstat.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);}
  .mstat.done .dot{background:var(--ok);
    box-shadow:inset 0 0 0 1px var(--ok),
      0 0 0 0 transparent;}
  .mstat.done .check{font-size:10px;font-weight:700;margin-right:1px;}
  .mstat.me{outline:2px solid var(--ink);outline-offset:1px;font-weight:600;}
  .mstat .ct{color:var(--muted);font-size:11px;font-weight:500;}
  .mstat.pending .ct{color:#8a5d00;opacity:.8;}
  .mstat.done .ct{color:var(--ok);opacity:.7;}

  /* 작성 완료 토글 */
  .btn-done{display:inline-flex;align-items:center;gap:7px;
    font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:12px;
    padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--surface);color:var(--muted);cursor:pointer;
    transition:background var(--t),border-color var(--t),color var(--t);}
  .btn-done:hover{border-color:var(--ok);color:var(--ok);}
  .btn-done .check{display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;
    font-size:9px;line-height:1;background:transparent;}
  .btn-done.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .btn-done.on .check{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* landing */
  .proj-item{display:flex;align-items:center;gap:12px;padding:14px 18px;
    border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;
    cursor:pointer;background:var(--surface);
    transition:border-color var(--t),transform var(--t),box-shadow var(--t);}
  .proj-item:hover{border-color:var(--ink);transform:translateY(-1px);
    box-shadow:var(--shadow-sm);}
  .proj-item .pn{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:15px;flex:1;}
  .proj-item .pc{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;
    color:var(--muted);font-weight:600;letter-spacing:.04em;
    background:var(--paper);padding:3px 9px;border-radius:999px;}
  .proj-list-all{max-height:520px;overflow:auto;padding-right:2px;}
  .proj-item .proj-del{border:1px solid var(--line-2);background:transparent;color:var(--accent);
    cursor:pointer;font-size:11px;font-weight:600;padding:5px 9px;border-radius:4px;
    flex-shrink:0;transition:color var(--t),background var(--t),border-color var(--t);}
  .proj-item .proj-del:hover{color:var(--accent-d);background:var(--accent-soft);
    border-color:var(--accent);}
  .trash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:0;}
  .trash-head.open{margin-bottom:12px;}
  .trash-head .section-label{margin:0;}
  .trash-toggle{display:flex;align-items:center;gap:10px;min-height:30px;padding:3px 1px;
    border:0;background:transparent;box-shadow:none;cursor:pointer;text-align:left;color:var(--muted);}
  .trash-toggle:hover .section-label{color:var(--ink);}
  .trash-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px;}
  .trash-chevron{width:8px;height:8px;border-right:1.5px solid currentColor;
    border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);
    transform-origin:center;transition:transform var(--t);}
  .trash-toggle[aria-expanded="true"] .trash-chevron{transform:rotate(225deg) translate(-1px,-1px);}
  .trash-item{cursor:default;background:var(--paper);}
  .trash-item:hover{border-color:var(--line-2);transform:none;box-shadow:none;}
  .proj-item .proj-restore{border:1px solid var(--line-2);background:var(--surface);
    color:var(--ok);cursor:pointer;font-size:11px;font-weight:600;padding:5px 9px;
    border-radius:4px;flex-shrink:0;transition:background var(--t),border-color var(--t);}
  .proj-item .proj-restore:hover{background:var(--ok-soft);border-color:var(--ok);}
  @media (max-width:640px){
    .proj-item{padding:12px;gap:8px;}
    .proj-item .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .proj-item .pc{padding:3px 7px;}
  }
  .hero{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:32px;letter-spacing:-.03em;margin-bottom:8px;line-height:1.1;}
  .hero .dot{color:var(--accent);}
  .code-input{text-transform:uppercase;width:130px;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    letter-spacing:.05em;font-weight:600;text-align:center;}

  /* utility */
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px;}
  .note{font-size:12.5px;color:var(--muted);background:var(--paper);
    padding:9px 13px;border-radius:var(--r-sm);margin:10px 0 0;line-height:1.5;}
  .note b{color:var(--ink-2);}
  code{background:var(--paper);padding:1px 6px;border-radius:4px;font-size:13px;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  #net-banner{position:fixed;top:0;left:0;right:0;z-index:9999;display:none;
    background:#c0392b;color:#fff;text-align:center;padding:8px 12px;
    font-size:13px;font-weight:600;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
    font-size:13px;z-index:50;font-weight:500;box-shadow:var(--shadow);
    animation:toastIn .25s cubic-bezier(.4,0,.2,1);}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}
    to{opacity:1;transform:translate(-50%,0);}}

  .danger-zone{background:rgba(207,61,30,.02);border-color:rgba(207,61,30,.18);}

  /* 페이지 인트로 박스 */
  .page-intro{background:var(--paper);border:1px solid var(--line);
    border-left:3px solid var(--accent);padding:11px 14px;
    border-radius:var(--r-sm);margin-bottom:16px;}
  .page-intro .pi-h{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:-.005em;color:var(--ink);margin-bottom:4px;
    display:flex;align-items:center;gap:6px;}
  .page-intro p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:0;}
  .page-intro b{color:var(--ink);font-weight:600;}

  /* 시간표 포맷 설정 그룹 */
  .fmt-group{background:var(--paper);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:14px 14px 12px;margin-top:4px;}

  /* 드래그 중 모바일 스크롤 막기 */
  body.dragging{user-select:none;-webkit-user-select:none;}
  body.dragging .scroll, body.dragging td{touch-action:none;}

  /* 페이지 푸터 */
  .page-foot{margin-top:40px;padding:18px 0 28px;text-align:center;
    color:var(--muted-2);font-size:11.5px;letter-spacing:.04em;
    border-top:1px solid var(--line);}
  .page-foot b{color:var(--muted);font-weight:600;}
  .page-foot .ord{font-size:9px;vertical-align:super;margin-left:1px;}

  /* 튜토리얼 모달 */
  .modal-backdrop{position:fixed;inset:0;background:rgba(26,24,20,.55);
    z-index:100;display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;animation:modalIn .2s ease;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  @keyframes modalIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--surface);border-radius:var(--r);max-width:720px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.22);position:relative;overflow:hidden;
    animation:modalSlide .25s cubic-bezier(.4,0,.2,1);}
  @keyframes modalSlide{from{transform:translateY(-8px);opacity:.7;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 24px;border-bottom:1px solid var(--line);background:var(--paper);
    position:sticky;top:0;z-index:1;}
  .modal-head h2{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .modal-x{border:none;background:transparent;font-size:24px;cursor:pointer;
    color:var(--muted);padding:2px 10px;border-radius:6px;line-height:1;
    transition:background var(--t),color var(--t);}
  .modal-x:hover{background:var(--accent-soft);color:var(--accent);}
  .modal-body{padding:18px 28px 28px;max-height:calc(85vh - 60px);overflow-y:auto;}
  .tut-section{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .tut-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .tut-section h3{font-size:15px;margin-bottom:9px;font-weight:700;
    letter-spacing:-.01em;color:var(--ink);}
  .tut-section p{font-size:13.5px;color:var(--ink-2);margin-bottom:7px;line-height:1.65;}
  .tut-section ol, .tut-section ul{padding-left:22px;font-size:13.5px;
    color:var(--ink-2);line-height:1.7;}
  .tut-section ul ul, .tut-section ol ul{margin-top:3px;margin-bottom:4px;}
  .tut-section li{margin-bottom:5px;}
  .tut-section li b{color:var(--ink);font-weight:600;}
  .tut-section code{font-size:12px;background:var(--paper);padding:1px 5px;border-radius:3px;}
  .tut-section.tut-tip{background:var(--paper);padding:16px 18px;border-radius:var(--r-sm);
    border:1px solid var(--line);margin-bottom:0;}
  .tut-section.tut-tip h3{margin-bottom:6px;}
  .help-modal{max-width:780px;}
  .tut-intro{padding:17px 18px;margin-bottom:16px;background:var(--ink);color:var(--paper);
    border-radius:6px;}
  .tut-intro h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;
    font-weight:800;margin-bottom:6px;}
  .tut-intro p{font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.78);margin:0;}
  .tut-intro b{color:#fff;}
  .tut-role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px;}
  .tut-role{display:block;padding:12px 13px;border:1px solid rgba(255,255,255,.24);
    border-radius:6px;color:#fff;text-decoration:none;transition:border-color var(--t),background var(--t);}
  .tut-role:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);}
  .tut-role b{display:block;font-size:13.5px;margin-bottom:3px;}
  .tut-role span{display:block;color:rgba(255,255,255,.68);font-size:11.5px;line-height:1.45;}
  .tut-nav{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 18px;margin-bottom:20px;
    border-bottom:1px solid var(--line);}
  .tut-nav a{color:var(--ink-2);text-decoration:none;font-size:11.5px;font-weight:600;
    padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);}
  .tut-nav a:hover{border-color:var(--ink);color:var(--ink);}
  .tut-section[id]{scroll-margin-top:76px;}
  .tut-section h3{display:flex;align-items:center;gap:8px;}
  .tut-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    flex:0 0 22px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:700;}
  .tut-flow{counter-reset:tut-step;list-style:none;padding-left:0!important;margin-top:10px;}
  .tut-flow>li{counter-increment:tut-step;position:relative;padding:1px 0 12px 38px;
    margin-bottom:7px!important;min-height:30px;}
  .tut-flow>li::before{content:counter(tut-step);position:absolute;left:0;top:0;width:25px;height:25px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper);
    border:1px solid var(--line-2);color:var(--ink);font-size:11px;font-weight:700;}
  .tut-flow>li:not(:last-child)::after{content:'';position:absolute;left:12px;top:27px;
    width:1px;height:calc(100% - 16px);background:var(--line);}
  .tut-flow>li>strong{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px;}
  .tut-flow>li>span{display:block;color:var(--muted);font-size:12.5px;line-height:1.55;}
  .tut-callout{margin:11px 0 0;padding:10px 12px;border-left:3px solid var(--ok);
    background:var(--ok-soft);font-size:12.5px;line-height:1.6;color:var(--ink-2);}
  .tut-callout.warn{border-left-color:var(--accent);background:var(--warn-soft);}
  .tut-callout b{color:var(--ink);}
  .tut-top-link{display:inline-block;margin-top:8px;color:var(--muted);font-size:11px;
    text-decoration:none;}
  .tut-top-link:hover{color:var(--ink);}

  @media (max-width:640px){
    .wrap{padding:0 8px;}
    .card{padding:14px 12px;}
    /* 월간 캘린더를 화면 가장자리까지 확장 (wrap 8px + card 12px 회수) */
    .agg-cal-wrap{margin-left:-20px;margin-right:-20px;}
    .agg-cal-scroll{border-left:0;border-right:0;border-radius:0;}
    .agg-swipe-hint{padding-right:4px;}
    .hero{font-size:26px;}
    .tabs{margin-left:0;width:100%;}
    .tab{flex:1;text-align:center;}
    .hbar{gap:10px;}
    .help-modal .modal-head{padding:15px 17px;}
    .help-modal .modal-body{padding:15px 17px 22px;}
    .tut-intro{padding:14px;}
    .tut-role-grid{grid-template-columns:1fr;}
    .tut-nav{padding-bottom:15px;margin-bottom:17px;}
    .tut-section{margin-bottom:19px;padding-bottom:15px;}
  }

  /* 동방 사용 보드 */
  /* 보드 팝업은 화면에 고정 — 스크롤은 가운데 시간표 하나만 (세로) */
  .bd-backdrop{align-items:stretch;overflow:hidden;}
  .dayboard-modal{max-width:780px;width:calc(100vw - 32px);
    display:flex;flex-direction:column;}
  .dayboard-head{flex-shrink:0;}
  .dayboard-body{flex:1;min-height:0;display:flex;flex-direction:column;
    overflow:hidden;max-height:none;}
  .bd-namebar{flex-shrink:0;}
  .dayboard-nav{display:flex;align-items:center;gap:6px;min-width:0;}
  .dayboard-nav h2{font-size:16px;min-width:170px;text-align:center;white-space:nowrap;}
  .dayboard-nav button{width:28px;height:28px;border:1px solid var(--line-2);border-radius:6px;
    background:var(--surface);cursor:pointer;font-size:15px;color:var(--ink);flex-shrink:0;}
  .dayboard-nav button:hover{border-color:var(--ink);}
  .bd-scroll{flex:1;min-height:0;overflow-y:auto;}
  .bd-table{border-collapse:collapse;width:100%;min-width:460px;}
  .bd-th{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--paper);
    font-family:'Bricolage Grotesque',sans-serif;font-size:11.5px;font-weight:700;
    padding:7px 4px;text-align:center;}
  .bd-th-time{width:52px;}
  .bd-th-col{box-shadow:inset 0 -3px 0 hsl(var(--bh,0),60%,55%);min-width:56px;}
  .bd-time{position:sticky;left:0;z-index:1;background:var(--paper);
    font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted);
    padding:0 7px;text-align:right;border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);white-space:nowrap;}
  .bd-time.ov{opacity:.65;}
  .bd-reh{width:22%;max-width:150px;border-right:1px solid var(--line-2);
    border-bottom:1px solid var(--line);font-size:10.5px;padding:2px 7px;
    color:var(--muted);background:var(--paper);}
  .bd-reh.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600;}
  .bd-reh span{display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bd-reh i{font-style:normal;font-size:9px;margin-left:3px;padding:0 4px;border-radius:999px;
    background:rgba(0,0,0,.08);font-weight:500;}
  .bd-cell{height:30px;min-width:56px;border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);cursor:pointer;text-align:center;
    font-size:11.5px;padding:0 3px;user-select:none;}
  .bd-cell:hover{background:hsl(var(--bh,0),70%,95%);}
  .bd-cell.fill{background:hsl(var(--bh,0),70%,90%);color:hsl(var(--bh,0),65%,26%);font-weight:600;
    max-width:90px;white-space:normal;padding:3px;line-height:1.25;}
  .bd-nm{display:inline-block;}   /* 이름 중간에서는 줄바꿈 안 되게 — 이름 단위로만 감김 */
  .bd-nm+.bd-nm::before{content:'·';margin:0 3px;opacity:.55;}
  .bd-cell.fill.mine{box-shadow:inset 0 0 0 2px hsl(var(--bh,0),55%,55%);}
  .bd-cell.fill.mine:hover{text-decoration:line-through;}
  .bd-cell.bd-prev{background:hsl(var(--bh,0),70%,86%);}
  .bd-cell.bd-prev-del{background:var(--accent-soft);text-decoration:line-through;color:var(--accent-d);}
  /* 보드는 실시간으로 자주 다시 그려지므로 모달 진입 애니메이션을 재생하지 않음 (깜빡임 방지) */
  .bd-backdrop{animation:none;}
  .bd-backdrop .modal{animation:none;}
  /* 모달이 열려 있는 동안 뒤 페이지 스크롤 잠금 — 모달 내부 스크롤만 동작 */

async function copyText(value){
  try{ await navigator.clipboard.writeText(value); return true; }
  catch(_){
    const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.left='-10000px';
    document.body.appendChild(ta);ta.select();
    try{return document.execCommand('copy');}catch(__){return false;}finally{ta.remove();}
  }
}
const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function dateList(s,e){const out=[];let d=new Date(s+'T00:00:00');const end=new Date(e+'T00:00:00');
  let guard=0;while(d<=end&&guard<400){out.push(fmtDate(d));d.setDate(d.getDate()+1);guard++;}return out;}
const WD=['일','월','화','수','목','금','토'];
function wdOf(ds){return new Date(ds+'T00:00:00').getDay();}
function mdLabel(ds){const d=new Date(ds+'T00:00:00');return(d.getMonth()+1)+'/'+d.getDate();}
function timeList(sh,eh,sm){const out=[];for(let m=sh*60;m<eh*60;m+=sm)
  out.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return out;}
function parseTime(t){const [h,m]=t.split(':').map(Number);return h*60+(m||0);}
const hm=ms=>{const d=new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const overlap=(aS,aE,bS,bE)=>aS<bE&&bS<aE;
const isLive=ev=>!!ev&&ev.status!=='cancelled';          // 취소된 회차는 일정으로 치지 않는다
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return fmtDate(d);}
function weekOf(ds){const st=addDays(ds,-wdOf(ds));return[st,addDays(st,6)];}   // 일~토
const sortedIds=o=>Object.keys(o||{}).sort((a,b)=>(Number(o[a]?.ts)||0)-(Number(o[b]?.ts)||0)||a.localeCompare(b));

/* ---------------- 가용성 판정 엔진 ---------------- */
/* 특정 멤버가 [s,e) 절대시간에 바쁜가 — 1) 학기 주간 반복 2) 예외 일정 3) 확정 일정 */
function excRange(x){
  if(x.allDay){
    const s=new Date(x.startDate+'T00:00:00').getTime();
    const end=new Date(x.endDate+'T00:00:00'); end.setDate(end.getDate()+1);
    return [s,end.getTime()];
  }
  return [Number(x.start)||0,Number(x.end)||0];
}
function weeklyBusy(mid,s,e){
  const sid=activeSemesterId(); if(!sid) return false;
  const sem=state.semesters[sid]; if(!sem) return false;
  const semS=new Date(sem.startDate+'T00:00:00').getTime();
  const semE=new Date(sem.endDate+'T00:00:00'); semE.setDate(semE.getDate()+1);
  const step=cfgSlot()*60000;
  for(let t=s;t<e;t+=step){
    if(t<semS||t>=semE.getTime()) continue;       // 학기 밖 날짜엔 반복 일정 미적용
    const d=new Date(t);
    const slot=state.availability?.[sid]?.[mid]?.['d'+d.getDay()]?.[hm(t)];
    if(slot) return true;
  }
  return false;
}
function memberBusy(mid,s,e,opts={}){
  if(weeklyBusy(mid,s,e)) return '반복 일정';
  for(const xid in state.exceptions){
    const x=state.exceptions[xid];
    if(x.mid!==mid) continue;
    const [xs,xe]=excRange(x);
    if(overlap(s,e,xs,xe)) return x.title||EXC_LABEL[x.type]||'예외 일정';
  }
  for(const evid in state.events){
    if(evid===opts.ignoreEventId) continue;
    if(opts.ignoreIds?.includes(evid)) continue;
    const ev=state.events[evid];
    if(!isLive(ev)) continue;
    if(!ev.participants?.[mid]) continue;
    if(overlap(s,e,Number(ev.start),Number(ev.end))) return ev.title||'일정';
  }
  return false;
}
function locationBusy(loc,s,e,ignoreEventId){
  if(!loc) return false;
  const key=loc.trim().toLocaleLowerCase('ko-KR'); if(!key) return false;
  for(const evid in state.events){
    if(evid===ignoreEventId) continue;
    const ev=state.events[evid];
    if(!isLive(ev)) continue;
    if(String(ev.location||'').trim().toLocaleLowerCase('ko-KR')!==key) continue;
    if(overlap(s,e,Number(ev.start),Number(ev.end))) return ev.title||'일정';
  }
  return false;
}
/* 미팅 후보 시간 계산 — 날짜(열) x 슬롯(행) 격자.
   칸마다 무엇이 막고 있는지(기존 일정 / 개인 불가 / 지난 시간)까지 담아 그대로 그릴 수 있게 한다. */
const MT_MAX_DAYS=14;
function findMeetingSlots(mt,opts={}){
  const mids=participantsOf(mt);
  const empty={rows:[],days:[],dur:0,slot:cfgSlot(),total:0,truncated:false};
  if(!mids.length) return {...empty,error:'참여자를 먼저 선택하세요'};
  const dur=Number(opts.dur||mt.durationMin)||60;
  const slot=cfgSlot();
  const startMin=cfgDayStart()*60, endMin=cfgDayEnd()*60;
  const todayDs=fmtDate(new Date());
  const rangeStart=opts.from||mt.rangeStart, rangeEnd=opts.to||mt.rangeEnd;
  const from=(opts.allDays||rangeStart>=todayDs)?rangeStart:todayDs;
  if(!rangeEnd||from>rangeEnd) return {...empty,dur,error:'남은 날짜가 없습니다. 날짜 범위를 확인하세요'};
  const maxDays=opts.maxDays||MT_MAX_DAYS;
  const rows=[]; for(let m=startMin;m<endMin;m+=slot) rows.push(m);
  const locKey=String(mt.location||'').trim().toLocaleLowerCase('ko-KR');
  const now=Date.now();
  const days=[]; let total=0, truncated=false;
  for(const ds of dateList(from,rangeEnd)){
    const base=new Date(ds+'T00:00:00').getTime();
    const dayS=base+startMin*60000, dayE=base+endMin*60000;
    /* 이 날 이 미팅과 부딪히는 일정만 미리 추린다 (참여자가 겹치거나 같은 장소) */
    const evs=Object.keys(state.events).filter(id=>{
      if(id===opts.ignoreEventId) return false;
      const ev=state.events[id];
      if(!isLive(ev)||!overlap(dayS,dayE,Number(ev.start),Number(ev.end))) return false;
      return mids.some(mid=>ev.participants?.[mid])
        ||(locKey&&String(ev.location||'').trim().toLocaleLowerCase('ko-KR')===locKey);
    });
    const cells={}; const ok={}; let n=0;
    for(const m of rows){
      const cs=base+m*60000, ce=cs+slot*60000;
      const hit=evs.find(id=>overlap(cs,ce,Number(state.events[id].start),Number(state.events[id].end)));
      if(hit){
        const ev=state.events[hit], es=Number(ev.start), ee=Number(ev.end);
        cells[m]={kind:'ev',evid:hit,title:ev.title||'일정',type:ev.type,s:es,e:ee,
          head:es>=cs&&es<ce,mine:(ev.seriesId||ev.meetingId)===opts.mtid};
        continue;
      }
      if(cs<now){ cells[m]={kind:'past'}; continue; }
      const who=mids.filter(mid=>memberBusy(mid,cs,ce,{ignoreEventId:opts.ignoreEventId}));
      cells[m]=who.length?{kind:'na',who}:{kind:'free'};
    }
    for(const m of rows){
      if(m+dur>endMin) break;
      let good=true;
      for(let t=m;t<m+dur;t+=slot){ if(cells[t]?.kind!=='free'){good=false;break;} }
      if(!good) continue;
      ok[m]=base+m*60000; n++;
    }
    if(!n&&!opts.allDays) continue;
    if(days.length>=maxDays){ truncated=true; break; }
    days.push({ds,base,cells,ok,n}); total+=n;
  }
  return {rows,days,dur,slot,total,truncated,maxDays,error:null};
}

function saveMeetingDraft(){
  const d=state.mtDraft; if(!d) return;
  const title=String(d.title||'').trim();
  if(!title){toast('미팅 이름을 입력하세요');return;}
  if(!participantsOf(d).length){toast('참여자를 한 명 이상 선택하세요');return;}
  if(!d.rangeStart||!d.rangeEnd||d.rangeStart>d.rangeEnd){toast('후보 날짜 범위를 확인하세요');return;}
  const id=d.id||genId('mt');
  const rk=d.recur||'';
  if(rk&&!d.recurUntil){toast('반복 종료일을 정해주세요');return;}
  const obj={title,type:d.type||'meeting',participants:d.participants||{},
    durationMin:Number(d.durationMin)||60,rangeStart:d.rangeStart,rangeEnd:d.rangeEnd,
    projectId:d.projectId||'',location:String(d.location||'').trim(),
    description:String(d.description||'').trim(),
    recurrence:rk?{freq:'weekly',interval:rk==='w2'?2:1,until:d.recurUntil}:null,
    status:d.status||'planning',ts:d.ts||Date.now()};
  FB.update(R('meetings/'+id),obj).catch(wErr);
  if(d.id&&d.status==='confirmed') syncSeries(d.id,obj);
  state.mtDraft=null; state.mtFind=null; state.mtPick=null; render();
}
/* 미팅 정보를 고치면 아직 오지 않은 회차에도 반영한다 (시간은 회차별로 관리하므로 건드리지 않음) */
function syncSeries(mtid,obj){
  const now=Date.now();
  const ids=occurrencesOf(mtid);
  ids.forEach(evid=>{
    if(Number(state.events[evid].start)<now) return;
    FB.update(R('events/'+evid),{title:obj.title,type:obj.type,participants:obj.participants,
      projectId:obj.projectId,location:obj.location}).catch(wErr);
  });
  /* 반복 종료일을 늘렸으면 모자란 회차를 이어서 만든다 */
  const rk=recurKey(obj); if(!rk||!ids.length) return;
  const last=state.events[ids[ids.length-1]];
  const dur=Number(last.end)-Number(last.start);
  const endMs=new Date(obj.recurrence.until+'T23:59:59').getTime();
  const stepMs=recurStepDays(rk)*86400000;
  let t=Number(last.start)+stepMs, made=0;
  while(t<=endMs&&made<60){
    const evid=genId('ev');
    FB.set(R('events/'+evid),occEvent(obj,mtid,t,t+dur)).catch(wErr);
    t+=stepMs; made++;
  }
  if(made) toast(`회차 ${made}개를 이어서 만들었습니다`);
}
function deleteMeeting(mtid){
  const mt=state.meetings[mtid]; if(!mt) return;
  const n=occurrencesOf(mtid).length;
  if(!confirm(`'${mt.title}' 미팅을 삭제할까요?${n?`\n등록된 회차 ${n}개도 함께 삭제됩니다.`:''}`)) return;
  removeSeriesEvents(mtid);
  FB.remove(R('meetings/'+mtid)).catch(wErr);
  if(state.mtFind?.mtid===mtid) state.mtFind=null;
  if(state.mtPick?.mtid===mtid) state.mtPick=null;
  render();
}
/* ---- 회차(시리즈) ---- */
function occEvent(mt,mtid,s,e,extra){
  return {title:mt.title,type:mt.type||'meeting',start:s,end:e,
    participants:mt.participants||{},projectId:mt.projectId||'',location:mt.location||'',
    meetingId:mtid,seriesId:mtid,seriesDate:fmtDate(new Date(s)),ts:Date.now(),...extra};
}
/* 한 미팅에 속한 회차 id — 시작 시각 순 */
function occurrencesOf(mtid){
  return Object.keys(state.events)
    .filter(id=>(state.events[id]?.seriesId||state.events[id]?.meetingId)===mtid)
    .sort((a,b)=>Number(state.events[a].start)-Number(state.events[b].start));
}
function removeSeriesEvents(mtid){
  occurrencesOf(mtid).forEach(id=>FB.remove(R('events/'+id)).catch(wErr));
}
/* 첫 회차 시각 + 반복 규칙 → 회차 시작 시각 목록 */
function seriesStarts(firstMs,mt){
  const k=recurKey(mt); if(!k) return [firstMs];
  const untilDs=mt.recurrence?.until;
  if(!untilDs) return [firstMs];
  const end=new Date(untilDs+'T23:59:59').getTime();
  const stepMs=recurStepDays(k)*86400000;
  const out=[]; let t=firstMs, guard=0;
  while(t<=end&&guard<80){ out.push(t); t+=stepMs; guard++; }
  return out.length?out:[firstMs];
}
function confirmMeeting(mtid,s,e){
  const mt=state.meetings[mtid]; if(!mt) return;
  const dur=e-s;
  const starts=seriesStarts(s,mt);
  let first=null;
  starts.forEach(st=>{
    const evid=genId('ev'); if(!first) first=evid;
    FB.set(R('events/'+evid),occEvent(mt,mtid,st,st+dur)).catch(wErr);
  });
  FB.update(R('meetings/'+mtid),{status:'confirmed',confirmedEventId:first,
    confirmedStart:starts[0],confirmedEnd:starts[0]+dur}).catch(wErr);
  state.mtFind=null; state.mtPick=null;
  toast(starts.length>1?`회차 ${starts.length}개가 Lab Calendar에 등록되었습니다`
                       :'미팅이 확정되어 Lab Calendar에 등록되었습니다');
}
function unconfirmMeeting(mtid){
  const mt=state.meetings[mtid]; if(!mt) return;
  const n=occurrencesOf(mtid).length;
  if(!confirm(`'${mt.title}' 확정을 취소할까요? 등록된 회차 ${n}개가 삭제되고 다시 조율 상태가 됩니다.`)) return;
  removeSeriesEvents(mtid);
  FB.update(R('meetings/'+mtid),{status:'planning',confirmedEventId:null,confirmedStart:null,confirmedEnd:null}).catch(wErr);
  state.mtFind=null; state.mtPick=null;
}
/* 회차 하나만 옮기기 — 시리즈의 나머지는 그대로 */
function moveOccurrence(evid,s,e){
  const ev=state.events[evid]; if(!ev) return;
  FB.update(R('events/'+evid),{start:s,end:e,moved:true}).catch(wErr);
  const mtid=ev.seriesId||ev.meetingId;
  if(mtid&&state.meetings[mtid]?.confirmedEventId===evid)
    FB.update(R('meetings/'+mtid),{confirmedStart:s,confirmedEnd:e}).catch(wErr);
  state.mtFind=null; state.mtPick=null; toast('회차 시간을 옮겼습니다');
}
/* 그 주에 회차 하나 더 (학회 전 몰아서 2~3회 하는 경우) */
function addOccurrence(mtid,s,e){
  const mt=state.meetings[mtid]; if(!mt) return;
  const evid=genId('ev');
  FB.set(R('events/'+evid),occEvent(mt,mtid,s,e,{extra:true})).catch(wErr);
  state.mtFind=null; state.mtPick=null; toast('회차를 추가했습니다');
}
/* 두 일정의 시작 시각을 맞바꾼다 — 각자 길이는 그대로 (미팅 순서 바꾸기) */
function swapOccurrence(aid,bid){
  const a=state.events[aid], b=state.events[bid]; if(!a||!b||aid===bid) return;
  const aS=Number(a.start),aE=Number(a.end),bS=Number(b.start),bE=Number(b.end);
  const na={start:bS,end:bS+(aE-aS)}, nb={start:aS,end:aS+(bE-bS)};
  if(overlap(na.start,na.end,nb.start,nb.end)){
    toast('길이가 달라 서로 겹칩니다. 시간을 직접 골라주세요'); return;
  }
  [[aid,na],[bid,nb]].forEach(([id,v])=>{
    FB.update(R('events/'+id),{...v,moved:true}).catch(wErr);
    const ev=state.events[id], mtid=ev.seriesId||ev.meetingId;
    if(mtid&&state.meetings[mtid]?.confirmedEventId===id)
      FB.update(R('meetings/'+mtid),{confirmedStart:v.start,confirmedEnd:v.end}).catch(wErr);
  });
  state.mtFind=null; state.mtPick=null;
  toast(`'${a.title}' ↔ '${b.title}' 시간을 맞바꿨습니다`);
}
/* 취소는 삭제가 아니라 표시 — 캘린더에 회색으로 남고 되돌릴 수 있다 */
function setOccCancel(evid,on){
  if(!state.events[evid]) return;
  state.calPick=null;
  FB.update(R('events/'+evid),{status:on?'cancelled':null}).catch(wErr);
  toast(on?'회차를 취소했습니다':'취소를 되돌렸습니다');
}
function deleteOccurrence(evid){
  const ev=state.events[evid]; if(!ev) return;
  const when=`${mdLabel(fmtDate(new Date(Number(ev.start))))} ${hm(Number(ev.start))}`;
  if(!confirm(`${when} 회차를 완전히 삭제할까요?`)) return;
  const mtid=ev.seriesId||ev.meetingId;
  FB.remove(R('events/'+evid)).catch(wErr);
  if(mtid&&state.meetings[mtid]&&occurrencesOf(mtid).filter(id=>id!==evid).length===0)
    FB.update(R('meetings/'+mtid),{status:'planning',confirmedEventId:null,
      confirmedStart:null,confirmedEnd:null}).catch(wErr);
}
function saveEventEdit(){
  const d=state.evEdit; if(!d) return;
  const title=String(d.title||'').trim();
  if(!title){toast('일정 이름을 입력하세요');return;}
  if(!d.date){toast('날짜를 확인하세요');return;}
  const base=new Date(d.date+'T00:00:00').getTime();
  const s=base+Number(d.fromMin)*60000, e=base+Number(d.toMin)*60000;
  if(!(e>s)){toast('시작과 종료 시각을 확인하세요');return;}

    participants:d.participants||{},projectId:d.projectId||'',
    location:String(d.location||'').trim(),ts:d.ts||Date.now()}).catch(wErr);
  state.evEdit=null; render();
}
function deleteEvent(evid){
  const ev=state.events[evid]; if(!ev) return;
  if(!confirm(`'${ev.title}' 일정을 삭제할까요?`)) return;
  const mtid=ev.seriesId||ev.meetingId;
  if(mtid&&state.meetings[mtid]&&occurrencesOf(mtid).filter(id=>id!==evid).length===0)
    FB.update(R('meetings/'+mtid),{status:'planning',confirmedEventId:null,confirmedStart:null,confirmedEnd:null}).catch(wErr);
  FB.remove(R('events/'+evid)).catch(wErr);
  state.evEdit=null; render();
}
function saveException(){
  const d=state.xDraft; if(!d) return;
  if(!d.mid){toast('멤버를 선택하세요');return;}
  const title=String(d.title||'').trim();
  if(!title){toast('제목을 입력하세요 (예: ECCV 출장)');return;}
  const id=d.id||genId('x');
  const obj={mid:d.mid,title,type:d.type||'other',allDay:!!d.allDay,ts:d.ts||Date.now()};
  if(d.allDay){
    if(!d.startDate||!d.endDate||d.startDate>d.endDate){toast('날짜 범위를 확인하세요');return;}
    obj.startDate=d.startDate; obj.endDate=d.endDate; obj.start=null; obj.end=null;
  }else{
    if(!d.startDate){toast('날짜를 확인하세요');return;}
    const base=new Date(d.startDate+'T00:00:00').getTime();
    const s=base+Number(d.fromMin)*60000, e=base+Number(d.toMin)*60000;
    if(!(e>s)){toast('시작과 종료 시각을 확인하세요');return;}
    obj.start=s; obj.end=e; obj.startDate=null; obj.endDate=null;
  }
  FB.update(R('exceptions/'+id),obj).catch(wErr);
  state.xDraft=null; render();
}
function deleteException(xid){
  const x=state.exceptions[xid]; if(!x) return;
  if(!confirm(`'${x.title}' 예외 일정을 삭제할까요?`)) return;
  FB.remove(R('exceptions/'+xid)).catch(wErr);
}

let deferRender=false, avPaint=null;
function render(){
  const a=document.activeElement;
  if(avPaint){deferRender=true;return;}
  if(a&&a.tagName==='INPUT'&&(a.type==='text'||a.type==='email')&&$('app').contains(a)){
    deferRender=true;return;}
  doRender();
}
function doRender(){
  const scrolls=[...$('app').querySelectorAll('.scroll')]
    .map(sc=>({sl:sc.scrollLeft,st:sc.scrollTop}));
  const ws=window.scrollY||0;
  renderHeader(); renderBody();
  const newScrolls=[...$('app').querySelectorAll('.scroll')];
  newScrolls.forEach((sc,i)=>{ const s=scrolls[i]; if(!s)return; sc.scrollLeft=s.sl; sc.scrollTop=s.st; });
  window.scrollTo(0,ws);
  syncScrollLock();
}
let _lockY=0;
function syncScrollLock(){
  const need=!!(state.evEdit||state.xDraft||state.subscribeFor||state.showHelp);
  const has=document.body.classList.contains('no-scroll');
  if(need&&!has){ _lockY=window.scrollY||0; document.body.classList.add('no-scroll'); document.body.style.top=(-_lockY)+'px'; }
  else if(!need&&has){ document.body.classList.remove('no-scroll'); document.body.style.top=''; window.scrollTo(0,_lockY); }
}

/* ======== Calendar ======== */
function calEventsByDate(){
  const byDate={};
  const mF=state.calMember, pF=state.calProject, tF=state.calType;
  for(const evid in state.events){
    const ev=state.events[evid];
    if(mF&&!ev.participants?.[mF]) continue;
    if(pF&&ev.projectId!==pF) continue;
    if(tF&&ev.type!==tF) continue;
    const ds=fmtDate(new Date(Number(ev.start)));
    (byDate[ds]=byDate[ds]||[]).push({kind:'ev',id:evid,...ev});
  }
  for(const xid in state.exceptions){
    const x=state.exceptions[xid];
    if(mF&&x.mid!==mF) continue;
    if(pF) continue;                                  // 예외 일정은 프로젝트 없음
    if(tF&&x.type!==tF) continue;
    const [xs,xe]=excRange(x);
    if(!xs||!xe) continue;
    let d=new Date(xs);
    let guard=0;
    while(d.getTime()<xe&&guard<62){
      const ds=fmtDate(d);
      (byDate[ds]=byDate[ds]||[]).push({kind:'x',id:xid,...x,dayStart:d.getTime()});
      d.setDate(d.getDate()+1); guard++;
    }
  }
  Object.values(byDate).forEach(a=>a.sort((p,q)=>{
    const ps=p.kind==='ev'?Number(p.start):(p.allDay?0:Number(p.start));
    const qs=q.kind==='ev'?Number(q.start):(q.allDay?0:Number(q.start));
    return ps-qs;
  }));
  return byDate;
}
