/* ---- 주간 뷰 — 매주 반복되는 그 주의 배치. 여기서 바로 회차를 고친다 ---- */
function viewCalWeek(now){
  const ws=state.calWeek, days=dateList(ws,addDays(ws,6));
  const todayDs=fmtDate(now);
  const slot=cfgSlot(), startMin=cfgDayStart()*60, endMin=cfgDayEnd()*60;
  const rows=[]; for(let m=startMin;m<endMin;m+=slot) rows.push(m);
  const byDate=calEventsByDate();
  /* 수정 중이면(시간 변경/회차 추가) 그 주 후보를 겹쳐 그린다 */
  const find=state.mtFind&&state.mtFind.inCal?state.mtFind:null;
  const pick=find&&state.mtPick&&state.mtPick.mtid===find.mtid?state.mtPick:null;
  const findDay={}; if(find) find.days.forEach(d=>findDay[d.ds]=d);
  let count=0;
  const head='<tr><th class="wk-corner">시간</th>'+days.map(ds=>{
    const wd=wdOf(ds);
    return `<th class="${ds===todayDs?'today':wd===0?'sun':wd===6?'sat':''}">${mdLabel(ds)}<em>${WD[wd]}</em></th>`;
  }).join('')+'</tr>';
  /* 종일 예외 줄 */
  const allDay=days.map(ds=>{
    const items=(byDate[ds]||[]).filter(o=>o.kind==='x'&&o.allDay);
    count+=items.length;
    return `<td class="wk-all">${items.map(o=>
      `<button class="wk-chip x allday" style="--pc:${typeColor(o.type==='personal'?'other':o.type)};--pcs:${typeColorSoft(o.type==='personal'?'other':o.type)}"
        data-act="xopen" data-xid="${o.id}" title="${esc(memberName(o.mid))} · ${esc(o.title)} (${EXC_LABEL[o.type]||'예외'}) · 클릭하여 수정"
        ><span class="wk-n">${esc(memberName(o.mid))} · ${esc(o.title)}</span></button>`).join('')||''}</td>`;
  }).join('');
  const body=rows.map(m=>{
    const cells=days.map(ds=>{
      const base=new Date(ds+'T00:00:00').getTime();
      const cs=base+m*60000, ce=cs+slot*60000;
      const items=(byDate[ds]||[]).filter(o=>{
        if(o.kind==='x'&&o.allDay) return false;
        return overlap(cs,ce,Number(o.start),Number(o.end));
      });
      /* 하루 시작 전에 시작한 일정은 첫 줄을 머리로 삼아 이름이 보이게 한다 */
      const heads=items.filter(o=>(Number(o.start)>=cs&&Number(o.start)<ce)||(m===startMin&&Number(o.start)<cs));
      heads.forEach(()=>count++);
      const cand=findDay[ds]?.ok[m];
      const inPick=!!(pick&&pick.s!=null&&cs>=pick.s&&cs<pick.e);
      const inCur=!!(find?.cur&&cs>=find.cur.s&&cs<find.cur.e);
      const cls=['wk-cell']; if(m%60===0) cls.push('h0');
      const lead=items[0];
      if(items.length&&!heads.length) cls.push('cont');
      if(cs<Date.now()&&!items.length&&!cand) cls.push('past');
      if(cand) cls.push('cand');
      if(inCur) cls.push('cur');
      if(inPick) cls.push('sel');
      const style=lead?`--pc:${typeColor(lead.kind==='x'?(lead.type==='personal'?'other':lead.type):lead.type)};--pcs:${typeColorSoft(lead.kind==='x'?(lead.type==='personal'?'other':lead.type):lead.type)}`:'';
      let inner=heads.map(o=>chipHtml(o,find,pick)).join('');
      if(inPick&&cs===pick.s) inner=`<span class="wk-mark">✓ ${hm(pick.s)}~${hm(pick.e)}</span>`+inner;
      else if(inCur&&cs===find.cur.s) inner=`<span class="wk-mark">현재 ${hm(find.cur.s)}~${hm(find.cur.e)}</span>`+inner;
      const when=`${mdLabel(ds)} (${WD[wdOf(ds)]}) ${hm(cs)}`;
      if(cand){
        const e=cand+find.dur*60000;
        return `<td class="${cls.join(' ')}" style="${style}" role="button" tabindex="0"
          data-act="mtpick" data-mtid="${find.mtid}" data-s="${cand}" data-e="${e}"
          title="${when}~${hm(e)} (${find.dur}분)로 옮기기">${inner}</td>`;
      }
      if(!items.length&&!find){
        cls.push('free');
        return `<td class="${cls.join(' ')}" role="button" tabindex="0" data-act="calslot"
          data-date="${ds}" data-min="${m}" title="${when} 일정 추가">${inner}</td>`;
      }
      return `<td class="${cls.join(' ')}" style="${style}">${inner}</td>`;
    }).join('');
    return `<tr><td class="wk-rh${m%60===0?' hour':''}">${minLabel(m)}</td>${cells}</tr>`;
  }).join('');
  const title=`${mdLabel(ws)}~${mdLabel(addDays(ws,6))} VGI Lab Calendar`
    +(state.calMember?` · ${esc(memberName(state.calMember))}`:'')
    +(state.calProject?` · ${esc(projectName(state.calProject))}`:'');
  const html=`<div class="wk-wrap scroll"><div id="cal-export">
      <div class="agg-export-title">${title}</div>
      <table class="wk"><colgroup><col class="wk-c0">${days.map(()=>'<col>').join('')}</colgroup>
        <thead>${head}</thead>
        <tbody><tr><td class="wk-rh">종일</td>${allDay}</tr>${body}</tbody></table>
    </div></div>
    ${find?viewFindControls(find.mtid,find)+viewFindBar(find.mtid,find,pick,FIND_MODE[find.mode]||FIND_MODE.first)
          :viewWeekSelBar()}`;
  return {html,count};
}
/* 주간 격자의 일정 조각 */
function chipHtml(o,find,pick){
  const isEv=o.kind==='ev';
  const t=isEv?o.type:(o.type==='personal'?'other':o.type);
  const style=`--pc:${typeColor(t)};--pcs:${typeColorSoft(t)}`;
  const time=`${hm(Number(o.start))}~${hm(Number(o.end))}`;
  if(!isEv){
    const lbl=EXC_LABEL[o.type]||'예외';
    return `<button class="wk-chip x" style="${style}" data-act="xopen" data-xid="${o.id}"
      title="${esc(memberName(o.mid))} · ${esc(o.title)} (${lbl}) ${time} · 클릭하여 수정"
      ><span class="wk-n">${esc(memberName(o.mid))} · ${esc(o.title)}</span></button>`;
  }
  const off=o.status==='cancelled';
  const swap=find&&find.mode==='move'&&o.id!==find.evid&&!off;
  const on=(!find&&state.calPick===o.id)||(pick&&pick.swap===o.id);
  const tip=`${esc(o.title)} ${time}${o.location?' · '+esc(o.location):''} · ${esc(namesOf(participantsOf(o)))}`
    +(off?' · 취소됨':'')+(swap?' · 클릭하면 이 일정과 자리 바꾸기':'');
  return `<button class="wk-chip${off?' off':''}${on?' on':''}" style="${style}"
    data-act="${swap?'mtswap':'calevpick'}"${swap?` data-mtid="${find.mtid}"`:''} data-evid="${o.id}"
    title="${tip}"><span class="wk-t">${hm(Number(o.start))}</span> <span class="wk-n">${esc(o.title)}</span></button>`;
}
/* 주간 뷰에서 일정을 고르면 뜨는 조작 줄 */

  const s=Number(ev.start), e=Number(ev.end);
  const mtid=ev.seriesId||ev.meetingId;
  const mt=mtid?state.meetings[mtid]:null;
  const off=!isLive(ev);
  const rk=mt?recurKey(mt):'';
  return `<div class="wk-sel">
    <div class="wk-sel-t">
      <b>${esc(ev.title)}</b>
      <span class="sub">${whenLabel(s,e)} · ${(e-s)/60000}분${ev.location?' · '+esc(ev.location):''}${rk?` · ${RECUR_LABEL[rk]} 반복`:''}${off?' · 취소됨':''}</span>
    </div>
    <div class="wk-sel-act">
      ${mt&&!off?`<button class="btn sm" data-act="occmove" data-mtid="${mtid}" data-evid="${evid}" data-cal="1">시간 변경</button>

/* ---- 월간 뷰 (기존) ---- */
function viewCalMonth(now){
  const [year,month]=state.calMonth.split('-').map(Number);
  const monthStart=new Date(year,month-1,1);
  const gridStart=new Date(monthStart); gridStart.setDate(gridStart.getDate()-gridStart.getDay());
  const byDate=calEventsByDate();
  const cells=[];
  const cursor=new Date(gridStart);
  let monthCount=0;
  for(let i=0;i<42;i++){
    const ds=fmtDate(cursor), inMonth=cursor.getMonth()===month-1;
    const dow=cursor.getDay(), isToday=ds===fmtDate(now);
    const items=inMonth?(byDate[ds]||[]):[];
    if(inMonth) monthCount+=items.length;
    const html=items.map(o=>{
      if(o.kind==='ev'){
        const title=`${o.status==='cancelled'?'[취소] ':''}${esc(o.title)} · ${hm(Number(o.start))}–${hm(Number(o.end))}`+(o.location?` · ${esc(o.location)}`:'')+` · ${namesOf(participantsOf(o))}`;
        return `<button class="agg-event${o.status==='cancelled'?' ev-off':''}" style="--pc:${typeColor(o.type)}" data-act="evedit" data-evid="${o.id}" title="${title}${o.status==='cancelled'?' · 취소됨':''} · 클릭하여 수정">
          <span class="agg-event-time">${hm(Number(o.start))}~${hm(Number(o.end))}</span>
          <span class="agg-event-song-row"><span class="agg-event-song">${esc(o.title)}</span>${o.location?`<span class="agg-ext">${esc(o.location)}</span>`:''}</span>
        </button>`;
      }
      const lbl=EXC_LABEL[o.type]||'예외';
      return `<button class="agg-event x-event" style="--pc:${typeColor(o.type==='personal'?'other':o.type)}" data-act="xopen" data-xid="${o.id}" title="${esc(memberName(o.mid))} · ${esc(o.title)} (${lbl}) · 클릭하여 수정">
        <span class="agg-event-time">${o.allDay?lbl:hm(Number(o.start))+'~'+hm(Number(o.end))}</span>
        <span class="agg-event-song-row"><span class="agg-event-song">${esc(memberName(o.mid))} · ${esc(o.title)}</span></span>
      </button>`;
    }).join('');
    cells.push(`<div class="agg-cell${inMonth?'':' out'}${dow===0?' sun':dow===6?' sat':''}${isToday?' today':''}" data-act="caladd" data-date="${ds}" title="누르면 ${mdLabel(ds)} 일정 추가">
      <div class="agg-date-num"><span>${cursor.getDate()}</span></div>
      <div class="agg-events">${html}</div>
    </div>`);
    cursor.setDate(cursor.getDate()+1);
  }
  const weekdays=WD.map((d,i)=>`<div class="agg-weekday${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');
  const filterName=state.calMember?memberName(state.calMember):'';
  const html=`<div class="agg-cal-wrap"><div class="agg-cal-scroll scroll"><div class="agg-cal" id="cal-export">
      <div class="agg-export-title">${year}년 ${month}월 VGI Lab Calendar${filterName?`<span>· ${esc(filterName)}</span>`:''}${state.calProject?`<span>· ${esc(projectName(state.calProject))}</span>`:''}</div>
      <div class="agg-weekdays">${weekdays}</div>
      <div class="agg-month-grid">${cells.join('')}</div>
    </div></div></div>
    <div class="agg-swipe-hint">옆으로 밀어 나머지 요일 보기 →</div>
    ${monthCount?'':'<div class="agg-month-empty">이달 등록된 일정이 없습니다.</div>'}`;
  return {html,count:monthCount};
}

const minLabel=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
/* 후보 시간 격자 — 날짜(열) x 시작시각(행), 칸을 골라서 확정 */
const FIND_MODE={
  first:{title:'첫 회차(기본 시간) 고르기',apply:'이 시간으로 확정'},

function viewFindControls(mtid,find){

  return `<div class="mtg-mode" style="margin-top:10px">
      <span><b>${mode.title}</b>${find.scope?' · '+esc(find.scope):''}${find.inCal?' · 초록색 칸을 누르세요':''}</span>

/* 후보 격자 — 기존 일정 배치까지 같이 보여주고, 고른 시간은 길이만큼 통째로 표시한다 */
function viewMeetingFind(mtid,find){
  const mt=state.meetings[mtid];
  const mode=FIND_MODE[find.mode]||FIND_MODE.first;
  const modeBar=viewFindControls(mtid,find);
  if(find.error) return `<div class="mt-cands">${modeBar}<div class="note">${esc(find.error)}</div></div>`;
  if(!find.days.length) return `<div class="mt-cands">${modeBar}<div class="note">조건에 맞는 시간이 없습니다. 날짜 범위를 넓히거나 참여자·길이를 조정해보세요.</div></div>`;
  const pick=state.mtPick&&state.mtPick.mtid===mtid?state.mtPick:null;
  const wide=find.days.length<=7;
  const head='<tr><th class="mtg-corner">시간</th>'+find.days.map(d=>{
    const wd=wdOf(d.ds);
    return `<th class="mtg-day${wd===0?' sun':wd===6?' sat':''}">${mdLabel(d.ds)}<em>${WD[wd]}</em></th>`;
  }).join('')+'</tr>';
  const slotMs=find.slot*60000;
  const body=find.rows.map(m=>{
    const cells=find.days.map(d=>{
      const c=d.cells[m]||{kind:'free'};
      const cs=d.base+m*60000, ce=cs+slotMs;
      const cand=d.ok[m];
      const inPick=!!(pick&&pick.s!=null&&cs>=pick.s&&cs<pick.e);
      const inCur=!!(find.cur&&cs>=find.cur.s&&cs<find.cur.e);
      const cls=['mtg-cell'];
      if(c.kind!=='free') cls.push(c.kind);
      if(cand) cls.push('cand');
      if(inCur) cls.push('cur');
      if(inPick) cls.push('sel');
      if(c.kind==='ev'&&pick?.swap===c.evid) cls.push('swap-on');
      const when=`${mdLabel(d.ds)} (${WD[wdOf(d.ds)]}) ${hm(cs)}`;
      let inner='';
      if(inPick&&cs===pick.s) inner=`<span class="mtg-in mark">✓ ${hm(pick.s)}~${hm(pick.e)}</span>`;
      else if(inCur&&cs===find.cur.s) inner=`<span class="mtg-in mark">현재 ${hm(find.cur.s)}~${hm(find.cur.e)}</span>`;
      else if(c.kind==='ev'&&c.head&&wide) inner=`<span class="mtg-in">${esc(c.title)}</span>`;
      if(cand){
        const e=cand+find.dur*60000;
        const lbl=`${when}~${hm(e)} (${find.dur}분)`;
        return `<td class="${cls.join(' ')}"><button type="button" class="mtg-btn" data-act="mtpick"
          data-mtid="${mtid}" data-s="${cand}" data-e="${e}" title="${lbl}" aria-label="${lbl}"
          aria-pressed="${inPick&&cs===pick.s}">${inner}</button></td>`;
      }
      if(c.kind==='ev'){
        const range=`${hm(c.s)}~${hm(c.e)}`;
        /* 시간 변경 중이라면 다른 미팅을 눌러 자리를 맞바꿀 수 있다 */
        const swappable=find.mode==='move'&&c.evid!==find.evid;
        const tip=`${esc(c.title)} · ${range}${swappable?' · 클릭하면 이 일정과 자리 바꾸기':''}`;
        const style=`--pc:${typeColor(c.type)};--pcs:${typeColorSoft(c.type)}`;
        return swappable
          ?`<td class="${cls.join(' ')} swap" style="${style}"><button type="button" class="mtg-ev"
              data-act="mtswap" data-mtid="${mtid}" data-evid="${c.evid}" title="${tip}" aria-label="${tip}">${inner}</button></td>`
          :`<td class="${cls.join(' ')}" style="${style}" title="${tip}">${inner}</td>`;
      }
      const tip=c.kind==='na'?`${esc(namesOf(c.who))} 불가`:c.kind==='past'?'지난 시간':`${find.dur}분이 들어가지 않습니다`;
      return `<td class="${cls.join(' ')}" title="${when} · ${tip}">${inner}</td>`;
    }).join('');
    return `<tr><td class="mtg-rh${m%60===0?' hour':''}">${minLabel(m)}</td>${cells}</tr>`;
  }).join('');
  return `<div class="mt-cands">
    ${modeBar}
    <div class="mt-find-head">전원 가능한 ${find.dur}분 자리 <b>${find.total}</b>개 · ${find.days.length}일${find.truncated?` (가능한 날이 많아 앞쪽 ${find.maxDays}일만 표시)`:''}
      <span class="mtg-legend"><i class="lg-ok"></i>가능<i class="lg-ev"></i>기존 일정<i class="lg-na"></i>참여자 불가${find.cur?'<i class="lg-cur"></i>현재 시간':''}</span></div>
    <div class="mtg-wrap scroll"><table class="mtg${wide?' wide':''}"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    ${viewFindBar(mtid,find,pick,mode)}
  </div>`;
}
/* 격자 아래 확인 바 — 고른 시간(또는 자리 바꿀 상대)을 글자로 다시 보여준다 */
function viewFindBar(mtid,find,pick,mode){
  const mt=state.meetings[mtid];
  if(pick&&pick.swap){
    const a=state.events[find.evid], b=state.events[pick.swap];
    if(!a||!b) return '<div class="mtg-bar"><div class="mtg-pick sub">일정이 바뀌었습니다. 다시 골라주세요.</div></div>';
    const aS=Number(a.start),aE=Number(a.end),bS=Number(b.start),bE=Number(b.end);
    const na={s:bS,e:bS+(aE-aS)}, nb={s:aS,e:aS+(bE-bS)};
    const clash=overlap(na.s,na.e,nb.s,nb.e);
    const ignoreIds=[find.evid,pick.swap];
    const warn=[...participantsOf(a).filter(mid=>memberBusy(mid,na.s,na.e,{ignoreIds})),
                ...participantsOf(b).filter(mid=>memberBusy(mid,nb.s,nb.e,{ignoreIds}))];
    const uniq=[...new Set(warn)];
    return `<div class="mtg-bar on swap">
      <div class="mtg-pick">
        <b>${esc(a.title)}</b> ${whenLabel(aS,aE)} <span class="mtg-arrow">↔</span>
        <b>${esc(b.title)}</b> ${whenLabel(bS,bE)}
        <span class="sub">바꾼 뒤 · ${esc(a.title)} ${whenLabel(na.s,na.e)} / ${esc(b.title)} ${whenLabel(nb.s,nb.e)}</span>
        ${clash?'<span class="occ-warn">⚠ 길이가 달라 서로 겹칩니다 — 시간을 직접 골라주세요</span>'
               :uniq.length?`<span class="occ-warn">⚠ 바꾸면 ${esc(namesOf(uniq))} 불가</span>`:''}
      </div>
      <div class="mtg-bar-act">
        <button class="btn ghost sm" data-act="mtpickclear">선택 해제</button>
        <button class="btn sm" data-act="mtswapdo" data-a="${find.evid}" data-b="${pick.swap}" ${clash?'disabled':''}>자리 바꾸기</button>
      </div>
    </div>`;
  }
  if(!pick) return `<div class="mtg-bar"><div class="mtg-pick sub">초록색 칸을 눌러 시간을 고르세요${find.mode==='move'?' · 다른 미팅 칸을 누르면 그 미팅과 자리를 바꿉니다':''}.</div></div>`;
  let note='';
  if(find.mode==='first'){
    const rk=recurKey(mt);
    if(rk){
      /* 첫 회차만 보고 확정하면 뒤 회차가 겹치는 걸 나중에 알게 된다 — 미리 세어 알려준다 */
      const starts=seriesStarts(pick.s,mt), span=pick.e-pick.s, mids=participantsOf(mt);
      const clash=starts.filter(st=>mids.some(mid=>memberBusy(mid,st,st+span))||locationBusy(mt.location,st,st+span)).length;
      note=` · ${RECUR_LABEL[rk]} 회차 ${starts.length}개 생성`+(clash?` (그중 ${clash}개는 겹침 — 만든 뒤 회차별로 조정)`:'');
    }
  }else if(find.cur){
    note=` · 원래 ${whenLabel(find.cur.s,find.cur.e)}에서 옮김`;
  }
  return `<div class="mtg-bar on">
      <div class="mtg-pick"><b>${whenLabel(pick.s,pick.e)}</b>
        <span class="sub">${(pick.e-pick.s)/60000}분${mt?.location?' · '+esc(mt.location):''}${note}</span></div>
      <div class="mtg-bar-act">
        <button class="btn ghost sm" data-act="mtpickclear">선택 해제</button>
        <button class="btn sm" data-act="mtapply" data-mtid="${mtid}" data-s="${pick.s}" data-e="${pick.e}">${mode.apply}</button>
      </div>
    </div>`;
}
const whenLabel=(s,e)=>`${mdLabel(fmtDate(new Date(s)))} (${WD[new Date(s).getDay()]}) ${hm(s)}~${hm(e)}`;
/* 회차 목록 — 회차별 시간 변경 / 취소 / 그 주에 추가 */
function viewOccurrences(mtid){
  const ids=occurrencesOf(mtid);
  if(!ids.length) return '<div class="note">등록된 회차가 없습니다. 확정을 취소하고 다시 잡아주세요.</div>';
  const todayMs=new Date().setHours(0,0,0,0);
  const past=ids.filter(id=>Number(state.events[id].start)<todayMs);
  const cancelled=ids.filter(id=>!isLive(state.events[id]));
  const upcoming=ids.filter(id=>Number(state.events[id].start)>=todayMs&&isLive(state.events[id]));
  const showPast=!!state.occPast[mtid];
  const shown=showPast?ids:ids.filter(id=>Number(state.events[id].start)>=todayMs);
  const rows=shown.map(id=>{
    const ev=state.events[id];
    const s=Number(ev.start), e=Number(ev.end);
    const off=!isLive(ev), isPast=s<todayMs;
    const busy=(off||isPast)?[]:participantsOf(ev).filter(mid=>memberBusy(mid,s,e,{ignoreEventId:id}));
    return `<div class="occ-row${off?' off':''}${isPast?' past':''}">
      <span class="occ-n">${ids.indexOf(id)+1}</span>
      <span class="occ-when">${mdLabel(fmtDate(new Date(s)))} (${WD[new Date(s).getDay()]}) ${hm(s)}~${hm(e)}</span>
      ${ev.extra?'<span class="occ-tag add">추가 회차</span>':''}
      ${ev.moved?'<span class="occ-tag">시간 조정됨</span>':''}
      ${off?'<span class="occ-tag off">취소됨</span>':''}
      ${busy.length?`<span class="occ-warn" title="${esc(namesOf(busy))} 불가">⚠ ${esc(namesOf(busy))} 불가</span>`:''}
      <span class="occ-act">
        ${isPast?''
          :off?`<button class="btn ghost sm" data-act="occrestore" data-evid="${id}">되돌리기</button>`
              :`<button class="btn ghost sm" data-act="occmove" data-mtid="${mtid}" data-evid="${id}">시간 변경</button>
                <button class="btn ghost sm" data-act="occadd" data-mtid="${mtid}" data-evid="${id}" title="이 주에 회차를 하나 더 잡습니다">+ 이 주 추가</button>
                <button class="btn ghost sm" data-act="occcancel" data-evid="${id}">취소</button>`}
        <button class="btn danger sm" data-act="occdelete" data-evid="${id}">삭제</button>
      </span>
    </div>`;
  }).join('')||'<div class="note">남은 회차가 없습니다.</div>';
  return `<div class="occ-wrap">
    <div class="occ-head">
      <span>회차 <b>${ids.length}</b>개 · 남은 회차 ${upcoming.length}개${cancelled.length?` · 취소 ${cancelled.length}개`:''}</span>
      ${past.length?`<button class="btn ghost sm" data-act="occpast" data-mtid="${mtid}">${showPast?'지난 회차 숨기기':`지난 회차 ${past.length}개 보기`}</button>`:''}
    </div>
    ${rows}
  </div>`;
}
function viewMeetingCard(mtid){
  const mt=state.meetings[mtid];
  const mids=participantsOf(mt);
  const confirmed=mt.status==='confirmed';
  const find=state.mtFind&&state.mtFind.mtid===mtid&&!state.mtFind.inCal?state.mtFind:null;
  const findHtml=find?viewMeetingFind(mtid,find):'';
  const rk=recurKey(mt);

            ?(rk
              ?`🔁 <b>${RECUR_LABEL[rk]} ${WD[new Date(mt.confirmedStart).getDay()]} ${hm(mt.confirmedStart)}~${hm(mt.confirmedEnd)}</b> · ${mdLabel(mt.recurrence.until)}까지${nextEv?` · 다음 ${mdLabel(fmtDate(new Date(Number(nextEv.start))))} (${WD[new Date(Number(nextEv.start)).getDay()]}) ${hm(Number(nextEv.start))}`:' · 남은 회차 없음'}${mt.location?` · ${esc(mt.location)}`:''}`
              :`✅ <b>${mdLabel(fmtDate(new Date(mt.confirmedStart)))} (${WD[new Date(mt.confirmedStart).getDay()]}) ${hm(mt.confirmedStart)}~${hm(mt.confirmedEnd)}</b>${mt.location?` · ${esc(mt.location)}`:''}`)
            :`${Number(mt.durationMin)||60}분${rk?` · ${RECUR_LABEL[rk]}`:''} · 후보 ${mdLabel(mt.rangeStart)}~${mdLabel(mt.rangeEnd)}${mt.location?` · ${esc(mt.location)}`:''}`}

            <button class="btn ghost sm" data-act="mtedit" data-mtid="${mtid}">수정</button>`}

}
function viewMeetings(){
  const ids=sortedIds(state.meetings);
  const planning=ids.filter(id=>state.meetings[id].status!=='confirmed');
  const confirmed=ids.filter(id=>state.meetings[id].status==='confirmed')
    .sort((a,b)=>(state.meetings[a].confirmedStart||0)-(state.meetings[b].confirmedStart||0));
  let h='';
  if(state.mtDraft) h+=viewMeetingForm();
  else h+=`<div class="card"><button class="btn" data-act="mtnew">+ 새 미팅 만들기</button>
    <span class="sub" style="margin-left:10px">참여자를 고르면 전원 가능한 시간을 자동으로 찾아줍니다.</span></div>`;
  h+=`<div class="section-label" style="margin:18px 0 10px">시간 조율 중 <span class="count">${planning.length}</span></div>`;
  h+=planning.length?planning.map(viewMeetingCard).join(''):'<div class="card"><div class="empty">조율 중인 미팅이 없습니다.</div></div>';
  h+=`<div class="section-label" style="margin:18px 0 10px">확정된 미팅 <span class="count">${confirmed.length}</span></div>`;
  h+=confirmed.length?confirmed.map(viewMeetingCard).join(''):'<div class="card"><div class="empty">확정된 미팅이 없습니다.</div></div>';
  return h;
}

/* ======== Availability (주간 반복 + 예외) ======== */
function viewAvailability(){
  const mids=membersSorted(false);
  if(!state.avMember||!state.members[state.avMember]) state.avMember=mids[0]||'';
  const semIds=sortedIds(state.semesters);
  if(!state.avSemester||!state.semesters[state.avSemester]) state.avSemester=activeSemesterId();
  const sid=state.avSemester, mid=state.avMember;
  const memberOpts=mids.map(m=>`<option value="${m}" ${mid===m?'selected':''}>${esc(memberName(m))}</option>`).join('');
  const semOpts=semIds.map(s=>`<option value="${s}" ${sid===s?'selected':''}>${esc(state.semesters[s]?.name||s)}${activeSemesterId()===s?' (활성)':''}</option>`).join('');
  if(!mids.length) return '<div class="card"><div class="empty">먼저 Members 탭에서 멤버를 등록하세요.</div></div>';
  if(!semIds.length) return '<div class="card"><div class="empty">먼저 Members 탭에서 학기를 만들어주세요.</div></div>';
  const sem=state.semesters[sid]||{};
  const times=daySlots();
  const dows=[1,2,3,4,5,6,0];   // 월~일
  const grid=state.availability?.[sid]?.[mid]||{};
  const head='<tr><th class="av-corner">시간</th>'+dows.map(d=>`<th class="av-day${d===0?' sun':d===6?' sat':''}">${WD[d]}</th>`).join('')+'</tr>';
  const rows=times.map((t,ri)=>'<tr><td class="av-rh">'+t+'</td>'+dows.map((d,ci)=>{
    const no=!!grid['d'+d]?.[t];
    return `<td class="av-cell${no?' no':''}" data-cell="1" data-dow="${d}" data-time="${t}" data-r="${ri}" data-c="${ci}"></td>`;
  }).join('')+'</tr>').join('');
  const xIds=Object.keys(state.exceptions).filter(x=>state.exceptions[x].mid===mid)
    .sort((a,b)=>excRange(state.exceptions[a])[0]-excRange(state.exceptions[b])[0]);
  const xRows=xIds.map(xid=>{

      <span class="x-type" style="--pc:${typeColor(x.type==='personal'?'other':x.type)}">${EXC_LABEL[x.type]||'기타'}</span>

      <button class="proj-del" data-act="xdelete" data-xid="${xid}">삭제</button>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-head"><div><h2>주간 반복 일정</h2>
      <div class="sub" style="margin-top:4px">학기 동안 <b>매주 반복되는 안 되는 시간</b>을 칠하세요. 한 학기에 한 번만 입력하면 됩니다. (${esc(sem.startDate||'')} ~ ${esc(sem.endDate||'')})</div></div></div>
    <div class="mode-row" style="margin-bottom:12px">

      <span class="mode-lbl" style="margin-left:10px">학기</span><select data-act="avsemester">${semOpts}</select>
    </div>
    <div class="av-wrap scroll grid-touch"><table class="av-grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="note">칠해진 칸 = <b>안 되는 시간</b> (수업·랩미팅 외 고정 일정). PC는 드래그, 모바일은 꾹 눌러 드래그. 즉시 저장됩니다.</div>
  </div>

    <div class="card-head"><div><h2>예외 일정 (출장·휴가·학회)</h2>
      <div class="sub" style="margin-top:4px">특정 날짜에만 적용되는 일정. 이 기간에는 미팅 계산에서 자동으로 제외됩니다.</div></div>

    ${xRows||'<div class="empty">등록된 예외 일정이 없습니다.</div>'}
  </div>`;
}

/* ---------------- PNG / ICS ---------------- */
async function ensureH2c(){
  if(window.html2canvas) return window.html2canvas;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  return window.html2canvas;
}
async function exportCalPNG(){
  const el=$('cal-export'); if(!el){toast('내보낼 캘린더가 없습니다');return;}
  toast('PNG 생성 중...');
  try{
    const h2c=await ensureH2c();
    const width=el.scrollWidth;
    const canvas=await h2c(el,{backgroundColor:'#fffdf7',scale:2,width,
      windowWidth:Math.max(width,document.documentElement.clientWidth)});
    const link=document.createElement('a');
    link.download=`vgi-lab-${state.calMode==='month'?state.calMonth:state.calWeek}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('PNG를 저장했습니다');
  }catch(e){ console.error(e); toast('PNG 저장 실패'); }
}
function escapeICS(s){
  return String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');
}
function exportCalICS(){
  const byDate=calEventsByDate();
  const seen=new Set(), items=[];
  Object.values(byDate).flat().forEach(o=>{
    const key=o.kind+o.id; if(seen.has(key))return; seen.add(key);
    items.push(o);
  });
  if(!items.length){toast('내보낼 일정이 없습니다');return;}
  const pad=n=>String(n).padStart(2,'0');
  const stamp=ms=>{const d=new Date(ms);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;};
  const dstamp=ds=>ds.replace(/-/g,'');
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//vgi-lab//scheduler//KO','CALSCALE:GREGORIAN',
    `X-WR-CALNAME:${escapeICS('VGI Lab '+state.calMonth)}`];
  items.forEach(o=>{
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${o.kind}-${o.id}@vgi-lab`);
    lines.push(`DTSTAMP:${dtstamp}`);
    if(o.kind==='x'&&o.allDay){
      const endD=new Date(o.endDate+'T00:00:00'); endD.setDate(endD.getDate()+1);
      lines.push(`DTSTART;VALUE=DATE:${dstamp(o.startDate)}`);
      lines.push(`DTEND;VALUE=DATE:${dstamp(fmtDate(endD))}`);
      lines.push(`SUMMARY:${escapeICS(`[${EXC_LABEL[o.type]||'예외'}] ${memberName(o.mid)} · ${o.title}`)}`);
    }else if(o.kind==='x'){
      lines.push(`DTSTART:${stamp(Number(o.start))}`);
      lines.push(`DTEND:${stamp(Number(o.end))}`);
      lines.push(`SUMMARY:${escapeICS(`[${EXC_LABEL[o.type]||'예외'}] ${memberName(o.mid)} · ${o.title}`)}`);
    }else{
      lines.push(`DTSTART:${stamp(Number(o.start))}`);
      lines.push(`DTEND:${stamp(Number(o.end))}`);
      lines.push(`SUMMARY:${escapeICS(o.title)}`);
      lines.push(`DESCRIPTION:${escapeICS('참여자: '+namesOf(participantsOf(o))+(o.location?'\n장소: '+o.location:''))}`);
      if(o.location) lines.push(`LOCATION:${escapeICS(o.location)}`);
      if(o.status==='cancelled') lines.push('STATUS:CANCELLED');
    }
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=`vgi-lab-${state.calMonth}.ics`; link.click();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  toast('.ics 파일을 받았습니다');
}

/* 후보 격자 열기 — 같은 조건으로 다시 계산할 수 있게 조건도 함께 담아 둔다 */
function openFind(mtid,cfg={}){
  const mt=state.meetings[mtid]; if(!mt) return;
  const opts={from:cfg.from,to:cfg.to,dur:cfg.dur,maxDays:cfg.maxDays,allDays:cfg.allDays,
    ignoreEventId:cfg.mode==='move'?cfg.evid:undefined,mtid};
  state.mtFind={mtid,...cfg,...opts,...findMeetingSlots(mt,opts)};
  state.mtPick=null; render();
}

/* ---------------- 이벤트 바인딩 ---------------- */
function bindEvents(){
  const app=$('app'), hbar=$('hbar');

  function handleClick(e){
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act;
    if(act==='modal-noop'){e.stopPropagation();return;}
    if(act==='nav'){state.tab=t.dataset.tab; history.replaceState(null,'','#'+state.tab); render();return;}
    if(act==='help'){state.showHelp=true;render();return;}
    if(act==='closehelp'){state.showHelp=false;render();return;}
    /* Calendar */
    if(act==='calmonth'){
      const [y,m]=state.calMonth.split('-').map(Number);
      const d=new Date(y,m-1+(Number(t.dataset.d)||0),1);
      state.calMonth=fmtDate(d).slice(0,7); render(); return;
    }
    if(act==='calmode'){
      state.calMode=t.dataset.mode; lsSet('vgi.calMode',state.calMode);
      state.mtFind=null; state.mtPick=null; render();return;
    }
    if(act==='calweekgo'){
      state.calWeek=addDays(state.calWeek,7*(Number(t.dataset.d)||0));
      state.calPick=null; render();return;
    }
    if(act==='caltoday'){
      const td=fmtDate(new Date());
      state.calWeek=weekOf(td)[0]; state.calMonth=td.slice(0,7);
      state.calPick=null; render();return;
    }
    if(act==='calslot'){
      const ds=t.dataset.date, m=Number(t.dataset.min)||cfgDayStart()*60;
      state.evEdit={title:'',type:'meeting',projectId:'',location:'',participants:{},
        date:ds,fromMin:m,toMin:Math.min(m+60,cfgDayEnd()*60)};
      state.calPick=null; render();return;
    }
    if(act==='calevpick'){
      state.calPick=state.calPick===t.dataset.evid?null:t.dataset.evid; render();return;
    }
    if(act==='calpickclear'){state.calPick=null;render();return;}
    if(act==='calpng'){exportCalPNG();return;}
    if(act==='calics'){exportCalICS();return;}
    if(act==='calsub'){if(state.calMember){state.subscribeFor=state.calMember;render();}return;}
    if(act==='subclose'){state.subscribeFor=null;render();return;}
    if(act==='subcopy'){copyText(t.dataset.url).then(ok=>toast(ok?'구독 링크를 복사했습니다':'복사 실패'));return;}
    if(act==='evedit'){
      const ev=state.events[t.dataset.evid]; if(!ev)return;
      const d=new Date(Number(ev.start));
      state.evEdit={id:t.dataset.evid,title:ev.title,type:ev.type,projectId:ev.projectId||'',
        location:ev.location||'',participants:{...(ev.participants||{})},ts:ev.ts,
        date:fmtDate(d),fromMin:d.getHours()*60+d.getMinutes(),
        toMin:Math.round((Number(ev.end)-new Date(fmtDate(d)+'T00:00:00').getTime())/60000)};
      render();return;
    }
    if(act==='caladd'){
      const ds=t.dataset.date||fmtDate(new Date());
      state.evEdit={title:'',type:'meeting',projectId:'',location:'',participants:{},
        date:ds,fromMin:cfgDayStart()*60+240,toMin:cfgDayStart()*60+300};
      render();return;
    }
    if(act==='evclose'){state.evEdit=null;render();return;}
    if(act==='evsave'){syncEvDraft();saveEventEdit();return;}
    if(act==='evdelete'){deleteEvent(t.dataset.evid);return;}
    if(act==='evmember'){
      const d=state.evEdit; if(!d)return; syncEvDraft();
      d.participants=d.participants||{};
      if(d.participants[t.dataset.mid]) delete d.participants[t.dataset.mid];
      else d.participants[t.dataset.mid]=true;
      render();return;
    }
    /* Meetings */
    if(act==='mtnew'){
      const today=fmtDate(new Date());
      state.mtDraft={title:'',type:'meeting',durationMin:60,participants:{},
        rangeStart:today,rangeEnd:addDays(today,6),projectId:'',location:'',description:'',
        recur:'w1',recurUntil:defaultRecurUntil()};
      render();return;
    }
    if(act==='mtcancel'){state.mtDraft=null;render();return;}
    if(act==='mtsave'){syncMtDraft();saveMeetingDraft();return;}
    if(act==='mtmember'){
      const d=state.mtDraft; if(!d)return; syncMtDraft();
      d.participants=d.participants||{};
      if(d.participants[t.dataset.mid]) delete d.participants[t.dataset.mid];
      else d.participants[t.dataset.mid]=true;
      render();return;
    }
    if(act==='mtedit'){
      const mt=state.meetings[t.dataset.mtid]; if(!mt)return;
      state.mtDraft={id:t.dataset.mtid,...mt,participants:{...(mt.participants||{})},
        recur:recurKey(mt),recurUntil:mt.recurrence?.until||defaultRecurUntil()};
      state.mtFind=null; state.mtPick=null; render();
      $('mtForm')?.scrollIntoView({behavior:'smooth'});
      return;
    }
    if(act==='mtdelete'){deleteMeeting(t.dataset.mtid);return;}
    if(act==='mtfind'){
      const mtid=t.dataset.mtid, mt=state.meetings[mtid]; if(!mt)return;
      openFind(mtid,{mode:'first',scope:`후보 ${mdLabel(mt.rangeStart)}~${mdLabel(mt.rangeEnd)}`});
      return;
    }
    if(act==='mtfindclose'){state.mtFind=null;state.mtPick=null;render();return;}
    /* 회차: 그 주 안에서만 다시 고르게 한다 */
    if(act==='occmove'||act==='occadd'){
      const mtid=t.dataset.mtid, evid=t.dataset.evid;
      const mt=state.meetings[mtid], ev=state.events[evid]; if(!mt||!ev)return;
      const [ws,we]=weekOf(fmtDate(new Date(Number(ev.start))));
      const move=act==='occmove';
      const dur=move?(Number(ev.end)-Number(ev.start))/60000:(Number(mt.durationMin)||60);
      const inCal=t.dataset.cal==='1';
      if(inCal){ state.calWeek=ws; state.calPick=null; }
      openFind(mtid,{mode:move?'move':'extra',evid,from:ws,to:we,dur,maxDays:7,allDays:true,inCal,
        scope:`${mdLabel(ws)}~${mdLabel(we)} 주`,
        cur:move?{s:Number(ev.start),e:Number(ev.end)}:null});
      return;
    }
    if(act==='occcancel'){setOccCancel(t.dataset.evid,true);return;}
    if(act==='occrestore'){setOccCancel(t.dataset.evid,false);return;}
    if(act==='occdelete'){deleteOccurrence(t.dataset.evid);return;}
    if(act==='occpast'){
      const k=t.dataset.mtid;
      state.occPast={...state.occPast,[k]:!state.occPast[k]}; render();return;
    }
    if(act==='mtpick'){
      state.mtPick={mtid:t.dataset.mtid,s:Number(t.dataset.s),e:Number(t.dataset.e)};
      render();return;
    }
    if(act==='mtswap'){
      state.mtPick={mtid:t.dataset.mtid,swap:t.dataset.evid};
      render();return;
    }
    if(act==='mtswapdo'){swapOccurrence(t.dataset.a,t.dataset.b);return;}
    if(act==='mtpickclear'){state.mtPick=null;render();return;}
    if(act==='mtapply'){
      const s=Number(t.dataset.s), e=Number(t.dataset.e), mtid=t.dataset.mtid;
      const mode=state.mtFind?.mode||'first';
      if(mode==='move') moveOccurrence(state.mtFind.evid,s,e);
      else if(mode==='extra') addOccurrence(mtid,s,e);
      else confirmMeeting(mtid,s,e);
      return;
    }
    if(act==='mtunconfirm'){unconfirmMeeting(t.dataset.mtid);return;}
    /* Members / Semesters */
    if(act==='memadd'){addMember();return;}
    if(act==='memdelete'){deleteMember(t.dataset.mid);return;}
    if(act==='memactive'){
      const m=state.members[t.dataset.mid]; if(!m)return;
      updateMember(t.dataset.mid,{active:m.active===false});return;
    }
    if(act==='semadd'){addSemester();return;}
    if(act==='semdelete'){deleteSemester(t.dataset.sid);return;}
    if(act==='semactive'){FB.update(R('settings'),{activeSemester:t.dataset.sid}).catch(wErr);return;}
    /* Availability / Exceptions */
    if(act==='xnew'){
      state.xDraft={mid:t.dataset.mid||state.avMember,title:'',type:'travel',allDay:true,
        startDate:fmtDate(new Date()),endDate:fmtDate(new Date()),
        fromMin:cfgDayStart()*60,toMin:cfgDayStart()*60+120};
      render();return;
    }
    if(act==='xopen'){
      const x=state.exceptions[t.dataset.xid]; if(!x)return;
      const [xs]=excRange(x);
      state.xDraft={id:t.dataset.xid,mid:x.mid,title:x.title,type:x.type,allDay:!!x.allDay,ts:x.ts,
        startDate:x.allDay?x.startDate:fmtDate(new Date(xs)),
        endDate:x.allDay?x.endDate:fmtDate(new Date(xs)),
        fromMin:x.allDay?cfgDayStart()*60:new Date(Number(x.start)).getHours()*60+new Date(Number(x.start)).getMinutes(),
        toMin:x.allDay?cfgDayStart()*60+120:Math.round((Number(x.end)-new Date(fmtDate(new Date(xs))+'T00:00:00').getTime())/60000)};
      render();return;
    }
    if(act==='xdelete'){deleteException(t.dataset.xid);return;}
    if(act==='xclose'){state.xDraft=null;render();return;}
    if(act==='xsave'){syncXDraft();saveException();return;}
    if(act==='xmodaldelete'){const xid=t.dataset.xid; state.xDraft=null; deleteException(xid); render();return;}
    if(act==='xallday'){syncXDraft();state.xDraft.allDay=!state.xDraft.allDay;render();return;}
    /* Projects */
    if(act==='projadd'){addProject();return;}
    if(act==='projdelete'){deleteProject(t.dataset.pid);return;}
    if(act==='projmember'){
      const p=state.projects[t.dataset.pid]; if(!p)return;
      const on=!!p.members?.[t.dataset.mid];
      FB.update(R(`projects/${t.dataset.pid}/members`),{[t.dataset.mid]:on?null:true}).catch(wErr);
      return;
    }
  }
  app.addEventListener('click',handleClick);
  hbar.addEventListener('click',handleClick);

  /* draft 동기화 — 모달/폼의 텍스트 입력값을 상태에 반영 */
  function syncEvDraft(){
    const d=state.evEdit; if(!d)return;
    if($('evTitle'))d.title=$('evTitle').value;
    if($('evType'))d.type=$('evType').value;
    if($('evProj'))d.projectId=$('evProj').value;
    if($('evDate'))d.date=$('evDate').value;
    if($('evFrom'))d.fromMin=Number($('evFrom').value);
    if($('evTo'))d.toMin=Number($('evTo').value);
    if($('evLoc'))d.location=$('evLoc').value;
  }
  function syncMtDraft(){
    const d=state.mtDraft; if(!d)return;
    if($('mtTitle'))d.title=$('mtTitle').value;
    if($('mtType'))d.type=$('mtType').value;
    if($('mtDur'))d.durationMin=Number($('mtDur').value);
    if($('mtProj'))d.projectId=$('mtProj').value;
    if($('mtFrom'))d.rangeStart=$('mtFrom').value;
    if($('mtTo'))d.rangeEnd=$('mtTo').value;
    if($('mtLoc'))d.location=$('mtLoc').value;
    if($('mtRecur'))d.recur=$('mtRecur').value;
    if($('mtUntil'))d.recurUntil=$('mtUntil').value;
    if($('mtDesc'))d.description=$('mtDesc').value;
  }
  function syncXDraft(){
    const d=state.xDraft; if(!d)return;
    if($('xMid'))d.mid=$('xMid').value;
    if($('xType'))d.type=$('xType').value;
    if($('xTitle'))d.title=$('xTitle').value;
    if($('xFromD'))d.startDate=$('xFromD').value;
    if($('xToD'))d.endDate=$('xToD').value;
    if($('xDate'))d.startDate=$('xDate').value;
    if($('xFrom'))d.fromMin=Number($('xFrom').value);
    if($('xTo'))d.toMin=Number($('xTo').value);
  }

  app.addEventListener('change',e=>{
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act, v=t.value;
    if(act==='calmember'){state.calMember=v;render();}
    else if(act==='calproject'){state.calProject=v;render();}
    else if(act==='caltype'){state.calType=v;render();}
    else if(act==='avmember'){state.avMember=v;render();}
    else if(act==='avsemester'){state.avSemester=v;render();}
    else if(act==='memfield'){updateMember(t.dataset.mid,{[t.dataset.field]:v.trim()});}
    else if(act==='semfield'){FB.update(R('semesters/'+t.dataset.sid),{[t.dataset.field]:v.trim()}).catch(wErr);}
    else if(act==='setfield'){FB.update(R('settings'),{[t.dataset.field]:Number(v)}).catch(wErr);}
    else if(act==='projname'){FB.update(R('projects/'+t.dataset.pid),{name:v.trim()||'이름 없음'}).catch(wErr);}
    else if(act==='mtfield'&&state.mtDraft){state.mtDraft[t.dataset.field]=t.type==='number'?Number(v):v;}
    else if(act==='mtdur'&&state.mtFind){
      const f=state.mtFind;
      openFind(f.mtid,{...f,dur:Number(v)||60});
    }
    else if(act==='mtrecur'&&state.mtDraft){
      syncMtDraft(); state.mtDraft.recur=v;
      if(v&&!state.mtDraft.recurUntil) state.mtDraft.recurUntil=defaultRecurUntil();
      render();
    }
    else if(act==='evfield'&&state.evEdit){state.evEdit[t.dataset.field]=v;}
    else if(act==='evdt'&&state.evEdit){
      const f=$('evFrom'),to=$('evTo');
      if(f&&to){let fm=Number(f.value),tm=Number(to.value);
        if(tm<=fm){tm=fm+cfgSlot();to.value=String(tm);}
        state.evEdit.fromMin=fm;state.evEdit.toMin=tm;}
    }
    else if(act==='xfield'&&state.xDraft){state.xDraft[t.dataset.field]=v;}
    else if(act==='xdt'&&state.xDraft){
      const f=$('xFrom'),to=$('xTo');
      if(f&&to){let fm=Number(f.value),tm=Number(to.value);
        if(tm<=fm){tm=fm+cfgSlot();to.value=String(tm);}
        state.xDraft.fromMin=fm;state.xDraft.toMin=tm;}
    }
  });

  /* 텍스트 입력 blur 시 지연된 렌더 반영 */
  app.addEventListener('blur',e=>{
    if(e.target.tagName==='INPUT'&&deferRender){deferRender=false;setTimeout(render,30);}
  },true);

  /* Escape로 모달 닫기 */
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(state.evEdit){state.evEdit=null;render();return;}
    if(state.xDraft){state.xDraft=null;render();return;}
    if(state.subscribeFor!==null){state.subscribeFor=null;render();return;}
    if(state.showHelp){state.showHelp=false;render();return;}
  });

  /* role=button 키보드 활성화 */
  function handleActKey(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
    const t=e.target.closest('[role="button"][data-act]'); if(!t)return;
    e.preventDefault(); handleClick(e);
  }
  app.addEventListener('keydown',handleActKey);
  hbar.addEventListener('keydown',handleActKey);

  /* ---- 주간 그리드 페인팅 (박스 드래그, PC 즉시 / 모바일 long-press) ---- */
  const LONG_PRESS=320;
  let pvTimer=null, pvStart=null, pvBox=null, pvTarget=true, sx=0, sy=0, pType='';
  const stopTouchScroll=e=>{ if(e.cancelable) e.preventDefault(); };
  const enterDrag=()=>{document.body.classList.add('dragging');
    document.addEventListener('touchmove',stopTouchScroll,{passive:false});};
  const exitDrag=()=>{document.body.classList.remove('dragging');
    document.removeEventListener('touchmove',stopTouchScroll);};
  function cellAt(x,y){
    const el=document.elementFromPoint(x,y);
    return el&&el.closest?el.closest('td.av-cell'):null;
  }
  function paintPreview(){
    document.querySelectorAll('td.av-cell.pv').forEach(c=>c.classList.remove('pv','pv-e'));
    if(!pvBox)return;
    const [r0,r1]=[Math.min(pvBox.r0,pvBox.r1),Math.max(pvBox.r0,pvBox.r1)];
    const [c0,c1]=[Math.min(pvBox.c0,pvBox.c1),Math.max(pvBox.c0,pvBox.c1)];
    document.querySelectorAll('td.av-cell').forEach(td=>{
      const r=+td.dataset.r,c=+td.dataset.c;
      if(r>=r0&&r<=r1&&c>=c0&&c<=c1) td.classList.add('pv',...(pvTarget?[]:['pv-e']));
    });
  }
  function startPaint(td){
    pvTarget=!td.classList.contains('no');   // 시작 칸이 비어있으면 칠하기, 칠해져 있으면 지우기
    pvBox={r0:+td.dataset.r,c0:+td.dataset.c,r1:+td.dataset.r,c1:+td.dataset.c};
    avPaint=true; enterDrag(); paintPreview();
  }
  function commitPaint(){
    const box=pvBox; pvBox=null;
    document.querySelectorAll('td.av-cell.pv').forEach(c=>c.classList.remove('pv','pv-e'));
    avPaint=null; exitDrag();
    if(!box) {if(deferRender){deferRender=false;render();} return;}
    const sid=state.avSemester||activeSemesterId(), mid=state.avMember;
    if(!sid||!mid){if(deferRender){deferRender=false;render();} return;}
    const [r0,r1]=[Math.min(box.r0,box.r1),Math.max(box.r0,box.r1)];
    const [c0,c1]=[Math.min(box.c0,box.c1),Math.max(box.c0,box.c1)];
    const upd={};
    document.querySelectorAll('td.av-cell').forEach(td=>{
      const r=+td.dataset.r,c=+td.dataset.c;
      if(r<r0||r>r1||c<c0||c>c1)return;
      upd[`d${td.dataset.dow}/${td.dataset.time}`]=pvTarget?true:null;
    });
    /* 낙관적 반영 */
    const a=state.availability;
    const node=(((a[sid]=a[sid]||{})[mid]=a[sid][mid]||{}));
    Object.keys(upd).forEach(k=>{
      const [dk,tm]=k.split('/');
      if(upd[k]) (node[dk]=node[dk]||{})[tm]=true;
      else if(node[dk]) delete node[dk][tm];
    });
    FB.update(R(`availability/${sid}/${mid}`),upd).catch(wErr);
    deferRender=false; doRender();
  }
  app.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td.av-cell'); if(!td)return;
    pType=e.pointerType; sx=e.clientX; sy=e.clientY; pvStart=td;
    if(pType==='mouse'){ if(e.button!==0)return; startPaint(td); }
    else{
      pvTimer=setTimeout(()=>{pvTimer=null; startPaint(td); if(navigator.vibrate)navigator.vibrate(8);},LONG_PRESS);
    }
  });
  window.addEventListener('pointermove',e=>{
    if(pvTimer&&(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)){clearTimeout(pvTimer);pvTimer=null;pvStart=null;}
    if(!avPaint||!pvBox)return;
    const td=cellAt(e.clientX,e.clientY); if(!td)return;
    if(+td.dataset.r===pvBox.r1&&+td.dataset.c===pvBox.c1)return;
    pvBox.r1=+td.dataset.r; pvBox.c1=+td.dataset.c; paintPreview();
  });
  window.addEventListener('pointerup',e=>{
    if(pvTimer){ // 터치 짧은 탭 → 단일 칸 토글
      clearTimeout(pvTimer);pvTimer=null;
      const td=cellAt(e.clientX,e.clientY);
      if(td&&pvStart&&td===pvStart&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<12){
        startPaint(td); commitPaint();
      }
      pvStart=null; return;
    }
    pvStart=null;
    if(avPaint) commitPaint();
  });
  window.addEventListener('pointercancel',()=>{
    if(pvTimer){clearTimeout(pvTimer);pvTimer=null;}
    pvStart=null;
    if(avPaint){ pvBox=null;
      document.querySelectorAll('td.av-cell.pv').forEach(c=>c.classList.remove('pv','pv-e'));
      avPaint=null; exitDrag(); deferRender=false; render();
    }
  });
}

/* ---------------- 시작 ---------------- */
async function start(){
  const savedMode=lsGet('vgi.calMode');
  if(savedMode==='month'||savedMode==='week') state.calMode=savedMode;
  bindEvents();
  const h=location.hash.slice(1);
  if(NAV.some(([k])=>k===h)) state.tab=h;
  render();
  const status=await initFirebase();
  if(status==='no-config'){state.noConfig=true;state.loading=false;render();return;}
  if(status==='error'){state.fbError=true;state.loading=false;render();return;}
  watchConnection();
  subscribeAll();
}
start();
</script>
