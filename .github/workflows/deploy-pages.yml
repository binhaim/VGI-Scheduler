name: Deploy site

on:
  push:
    branches: [main]
  # 2시간마다 재생성 — 미팅을 확정해도 push는 일어나지 않으므로 구독 피드는 이 스케줄로 따라간다
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      # 이전 manifest를 가져와 내용이 안 바뀐 피드의 갱신 시각을 유지한다 (없으면 빈 값으로 시작)
      - name: Fetch previous feed manifest
        run: |
          mkdir -p .cache
          curl -fsSL --max-time 30 -o .cache/manifest.json \
            "https://binhaim.github.io/VGI-Scheduler/calendars/manifest.json" \
            || echo '{}' > .cache/manifest.json

      - name: Generate member calendar feeds
        run: npm run generate:feeds -- --output _site/calendars --previous .cache/manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
